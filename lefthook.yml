# Lefthook — git hooks manager
# Three-tier validation: pre-commit (fast, staged files), pre-push (full local CI), commit-msg.
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: 'packages/**/*.{ts,tsx,js,mjs}'
      run: npm run --silent oxlint
    markdown:
      glob: '**/*.md'
      run: npx --no markdownlint-cli2 {staged_files}
    shim-drift:
      run: perl -e 'alarm 120; exec @ARGV' -- npm run --silent oxlint:shims:check
    stale-build-artifacts:
      # Fails closed if any .js/.d.ts/.js.map files exist alongside .ts source
      # in packages/<pkg>/src/. These shadow current .ts at workspace runtime
      # (node + vitest both prefer .js when package.json#main points at it),
      # which is how the import-next/no-cycle regression hid for weeks before
      # the 2026-05-16 sweep. See scripts/check-stale-build-artifacts.ts.
      run: npm run --silent check-stale-artifacts
    scope-audit:
      # Validates that every ESLint rule lives in the correct plugin and that
      # its detection method matches its severity. Runs only when rule source
      # files or the manifest change. See scripts/ilb-plugin-scope-audit.ts.
      glob: '{packages/eslint-plugin-*/src/rules/**/*.ts,.agent/plugin-rule-manifest.json}'
      run: npm run --silent ilb:scope-audit
    rule-audit:
      # Ratchet over the per-rule defect taxonomy (scripts/rule-audit.ts): a rule
      # may not acquire a check it did not already carry, and a NEW rule must be
      # clean. Baseline: docs/rule-ledger/baseline.json.
      #
      # Same glob as scope-audit, for the same reason — a commit with no rule
      # source in it cannot change a rule's findings, so it pays nothing. When
      # the glob does match, --changed audits only the rules in the diff
      # (~80ms) rather than all 121 (~340ms); the rest is tsx startup.
      #
      # This is the FAST path and it is deliberately incomplete: editing a
      # shared util can change a rule this glob never sees. CI runs the full
      # gate, which is what actually holds the line.
      glob: '{packages/eslint-plugin-*/src/rules/**/*.ts,packages/eslint-plugin-*/src/utils/**/*.ts}'
      run: npm run --silent rule-audit:gate -- --changed
    case-descriptions:
      # The description ratchet has no DOWNWARD force. It freezes undescribed
      # cases per rule and permits only a fall — which has held, no rule has
      # gained one — but a rule at 197 may be edited forever provided it never
      # reaches 198. 419 rules carry 14,890 undescribed cases and the mechanism
      # to reduce them is "somebody decides to". Nobody decides to.
      #
      # So an edit to a rule must leave its descriptions better than it found
      # them: STRICTLY lower, not zero. A rule at 197 cannot be cleared in the
      # change that fixes a bug in it, and demanding that makes the gate
      # something people route around. One name per edit drains the debt at the
      # rate the code is actually worked on.
      #
      # Same glob and the same `changedRules()` resolver as the audit above —
      # two diff-to-rules mappings that could disagree is a defect this repo
      # has already paid for once.
      glob: '{packages/eslint-plugin-*/src/rules/**/*.ts,packages/eslint-plugin-*/src/utils/**/*.ts}'
      run: npm run --silent check:rule-cases:touched
    key-vocabulary:
      # An inline list of PROPERTY names compared against a key, with no option
      # and no stated authority.
      #
      # `check-name-vocabulary` covers rules reading an IDENTIFIER's name via
      # the devkit helpers. This covers the hole beside it: a rule that writes
      # the list inline never imports those helpers, so that gate never sees
      # it — which is how `['email','name','phone','address']` shipped with
      # `schema: []`.
      #
      # The test is who defines the name. Somebody else (WHATWG, an RFC, Node,
      # React, an SDK) -> say so in a `@vocabulary` comment. Our consumer ->
      # give them an option that REPLACES the default.
      glob: 'packages/eslint-plugin-*/src/**/*.ts'
      run: npm run --silent check:key-vocabulary
    spellings:
      # A rule may not acquire a blind spot it did not already have.
      #
      # `node.type === 'Literal'` sees 'sha1' and not `sha1`; `.property.name`
      # sees o.k and not o['k']. Neither is a decision — it is what those
      # expressions MEAN when the grammar allows a second spelling, and it is
      # invisible in review because the tests are written in the same spelling
      # as the rule. Measured: 1,113 misses across 159 of 470 rules.
      #
      # Ratcheted, not enforced retroactively: the existing 1,022 sites are
      # baselined. With 700 rules coming, refusing the next one is what scales.
      glob: 'packages/eslint-plugin-*/src/**/*.ts'
      run: npm run --silent check:spellings
    case-registry:
      # Executed evidence, not a stored verdict. Every coverage claim in
      # benchmarks/cases/registry.json is run through the rule that makes it,
      # and the VERIFIED SET is ratcheted — a run that verifies a new case while
      # dropping an old one keeps the same total, which is exactly the
      # regression this register exists to make impossible.
      #
      # Same glob as rule-audit: only a change to rule source or the register
      # itself can change a verdict.
      glob: '{packages/eslint-plugin-*/src/**/*.ts,benchmarks/cases/registry.json}'
      run: npm run --silent check:case-registry
    tests-affected:
      run: |
        if git rev-parse --verify --quiet origin/main >/dev/null; then
          npx --no turbo run test --filter="...[origin/main]" --output-logs=errors-only
        else
          npx --no turbo run test --output-logs=errors-only
        fi

# Pre-push: mirrors CI's "promote" gate locally. Runs the full battery in
# parallel so a developer can `git push` knowing every check CI will run on a
# ready_for_review PR has already passed. Use `npm run ci:local` for the same
# battery outside the git-push flow.
pre-push:
  parallel: true
  commands:
    typecheck:
      # Whole-graph TS7 (tsgo) typecheck of the plugin graph + @interlace/ui.
      # One tsgo --build over tsconfig.solution.json; see .agent/TS7_MIGRATION_PLAN.md.
      #
      # perl alarm is a portable timeout(1) — macOS ships none. Exit 142 means
      # the watchdog fired, i.e. the gate wedged rather than merely ran long.
      #
      # glob: a push with no TypeScript in it cannot break the typecheck, so it
      # does not pay for one. Same idea as pre-commit's globs, applied to the
      # files being PUSHED.
      glob: '**/*.{ts,tsx,mts,cts}'
      run: perl -e 'alarm 300; exec @ARGV' -- npm run --silent typecheck
    # build and test in ONE turbo invocation, deliberately.
    #
    # They used to be two commands, and because this hook is `parallel: true`
    # they ran as two turbo processes writing the same `.turbo/cache` at once.
    # They raced: one lost with `IO error: Operation not permitted (os error 1)`
    # and turbo exited non-zero *after every one of its tasks had succeeded*.
    # The gate reported `build` red with zero real failures, and the poisoned
    # entry meant the next run rebuilt from cold and often raced again.
    #
    # It cost most of a day. The symptom is maximally misleading: re-running
    # the same command by hand always passes, because a single turbo process
    # never collides with itself — so it reads as a flake right up until you
    # notice the gate has never once gone green on a cold cache.
    #
    # One invocation keeps the parallelism (turbo schedules both task graphs
    # itself, `test` has no `^build` dependency so nothing serialises) and
    # keeps one shared cache. Splitting the cache dirs instead would also fix
    # the race, at the price of never sharing a cache entry with a manual
    # `turbo run build` — every pre-push would rebuild the world.
    #
    # `oxlint:shims:verify` is chained on the end rather than left as its own
    # parallel command, for the same reason: every shim in tools/oxlint-plugins
    # `require()`s `<pkg>/dist/src/index.js`, so it reads exactly the tree the
    # build is writing. Run alongside, it fails in ~2s having read a file
    # mid-write, prints nothing at all, and the push aborts with no explanation.
    # Chaining guarantees it sees a finished dist. `shim-drift` stays parallel —
    # it compares generated shim *source*, and never touches dist.
    # Scoped to the packages affected vs origin/main, mirroring pre-commit's
    # `tests-affected`. Whole-repo was 74 tasks; affected is 21. That gap only
    # matters after a rebase — a rebase rewrites turbo's input hashes, so the
    # cache goes cold and the whole-repo form rebuilt the world (minutes)
    # instead of hitting cache (seconds). CI still runs the full graph, so
    # nothing reaches main unverified.
    #
    # The `git rev-parse` guard is the honesty check: with no origin/main to
    # diff against (detached HEAD, fresh clone) we run EVERYTHING rather than
    # silently scoping to nothing and reporting a green gate that verified
    # zero tasks.
    # The watchdog is `perl alarm`, never a backgrounded `sleep`. A
    # `( sleep N; kill ) &` watchdog was tried and is a trap twice over: the
    # EXIT handler's own `kill` overwrites `$?`, so a wedged gate reports
    # SUCCESS, and killing the subshell orphans its `sleep`, which holds the
    # pipe open and makes lefthook wait out the full N seconds on every run —
    # it manufactures the stall it exists to prevent. `perl -e 'alarm N; exec'`
    # replaces itself with the command: one process, no child to leak, and a
    # timeout surfaces as exit 142 (a FAILED gate, never a green one).
    build-and-test:
      # Nothing outside these paths can change what `turbo run build test`
      # produces, so a config-only or docs-only push does not pay for a build.
      glob: '{packages/**,apps/**,tools/**,scripts/**,turbo.json,package.json,package-lock.json,tsconfig*.json,vitest*.*}'
      # Kept on ONE line and chained with `&&` on purpose — see the
      # lefthook-turbo-cache-race lock, which pins exactly that shape so
      # `oxlint:shims:verify` can never read a half-written dist.
      # `set -f` stops the unquoted $FILTER from glob-expanding `[origin/main]`.
      # `build` is deliberately UNFILTERED while `test` is filtered.
      #
      # `oxlint:shims:verify` require()s `<pkg>/dist/src/index.js` for EVERY
      # plugin, not just the affected ones. Under `--filter=...[origin/main]`
      # the build produced dist for the 7 affected packages and the verify then
      # failed on the other 9 with `Cannot find module …/dist/src/index.js` —
      # a red gate that says nothing about the change. It reproduced 100% of
      # the time in a fresh worktree, for any push not touching all 30 plugins.
      #
      # Filtering `test` is where the time actually goes (74 tasks → 21), and
      # build is cache-hit in seconds once warm, so scoping only `test` keeps
      # the speed win without handing the verify a half-built tree.
      run: perl -e 'alarm 420; exec @ARGV' -- bash -c 'set -f; FILTER=; git rev-parse --verify --quiet origin/main >/dev/null && FILTER=--filter=...[origin/main]; npx --no turbo run build --output-logs=errors-only && npx --no turbo run test $FILTER --output-logs=errors-only && npm run --silent oxlint:shims:verify'
    # Only the markdown this push actually changes. `lint:md` walks 832 files
    # every time; a push that touches one .md paid for all of them.
    #
    # `{push_files}` is lefthook's own list of the pushed files, substituted and
    # quoted by lefthook — the exact counterpart of pre-commit's
    # `{staged_files}` above. An earlier version shelled out to `git diff` and
    # expanded the result unquoted, which word-split any path containing a
    # space; the `shellcheck disable=SC2086` on it silenced the diagnostic
    # without changing the behaviour. There is no shell quoting to get wrong
    # when there is no shell. Verified against `docs/a file with spaces.md`.
    markdown-full:
      glob: '**/*.md'
      run: npx --no markdownlint-cli2 {push_files}
    portability:
      # Scores oxlint portability of the RULES; nothing else can move it.
      glob: 'packages/eslint-plugin-*/src/**/*.ts'
      run: perl -e 'alarm 180; exec @ARGV' -- npm run --silent audit:portability:ci
    lockfile:
      # Version alignment can only drift when a manifest or the lockfile
      # changes. This gate was ~30s on every push, including pushes that
      # touched one .md.
      glob: '{package.json,package-lock.json,packages/*/package.json,apps/*/package.json,tools/*/package.json}'
      run: perl -e 'alarm 180; exec @ARGV' -- npm run --silent check-versions
    workflows:
      glob: '.github/**'
      run: perl -e 'alarm 120; exec @ARGV' -- npm run --silent lint:workflows
    changelog:
      # A changeset is only required when publishable source moves — which is
      # what `check-changeset-coverage.ts` asks. Raw `changeset status` asks
      # whether *any* file under a package changed, so it demanded a changeset
      # for editing a CHANGELOG, which when consumed edits the CHANGELOG again.
      # It also disagreed with the CI advisory, which had the right rule
      # inlined in YAML; both now call the same script.
      glob: '{.changeset/**,packages/**,apps/**}'
      run: perl -e 'alarm 120; exec @ARGV' -- npm run --silent changeset:coverage
    changeset-quality:
      # Blocks a breaking change to a published package that ships without an
      # upgrade path, plus placeholder summaries. npm has no undo, and this
      # text is the whole of what a consumer gets — see scripts/lint-changesets.ts.
      glob: '.changeset/*.md'
      run: perl -e 'alarm 60; exec @ARGV' -- npm run --silent changeset:lint
    changelog-shape:
      # Every CHANGELOG.md must open with an H1, or changesets files the next
      # release *under* whatever heading is on line 1 instead of above it —
      # see scripts/normalize-changelogs.ts for the failure this locks out.
      glob: '{packages/*/CHANGELOG.md,apps/*/CHANGELOG.md}'
      run: perl -e 'alarm 120; exec @ARGV' -- npm run --silent changelog:check
    shim-drift:
      # Shims are generated from rule sources and the manifest.
      glob: '{packages/eslint-plugin-*/src/**,tools/oxlint-plugins/**,.agent/plugin-rule-manifest.json}'
      run: perl -e 'alarm 120; exec @ARGV' -- npm run --silent oxlint:shims:check

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
