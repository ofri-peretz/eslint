# Lefthook — git hooks manager
# Three-tier validation: pre-commit (fast, staged files), pre-push (full local CI), commit-msg.
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: 'packages/**/*.{ts,tsx,js,mjs}'
      run: npm run --silent oxlint
    markdown:
      glob: '**/*.md'
      run: npx --no markdownlint-cli2 {staged_files}
    shim-drift:
      run: npm run --silent oxlint:shims:check
    stale-build-artifacts:
      # Fails closed if any .js/.d.ts/.js.map files exist alongside .ts source
      # in packages/<pkg>/src/. These shadow current .ts at workspace runtime
      # (node + vitest both prefer .js when package.json#main points at it),
      # which is how the import-next/no-cycle regression hid for weeks before
      # the 2026-05-16 sweep. See scripts/check-stale-build-artifacts.ts.
      run: npm run --silent check-stale-artifacts
    scope-audit:
      # Validates that every ESLint rule lives in the correct plugin and that
      # its detection method matches its severity. Runs only when rule source
      # files or the manifest change. See scripts/ilb-plugin-scope-audit.ts.
      glob: '{packages/eslint-plugin-*/src/rules/**/*.ts,.agent/plugin-rule-manifest.json}'
      run: npm run --silent ilb:scope-audit
    tests-affected:
      run: |
        if git rev-parse --verify --quiet origin/main >/dev/null; then
          npx --no turbo run test --filter="...[origin/main]" --output-logs=errors-only
        else
          npx --no turbo run test --output-logs=errors-only
        fi

# Pre-push: mirrors CI's "promote" gate locally. Runs the full battery in
# parallel so a developer can `git push` knowing every check CI will run on a
# ready_for_review PR has already passed. Use `npm run ci:local` for the same
# battery outside the git-push flow.
pre-push:
  parallel: true
  commands:
    typecheck:
      # Whole-graph TS7 (tsgo) typecheck of the plugin graph + @interlace/ui.
      # One tsgo --build over tsconfig.solution.json; see .agent/TS7_MIGRATION_PLAN.md.
      run: npm run --silent typecheck
    # build, test and shim-verify all touch packages/*/dist. Run them as ONE
    # sequential command: `parallel: true` above otherwise starts two concurrent
    # `turbo run` processes that write the same `dist/**` outputs, which fails
    # nondeterministically with `ENOTEMPTY, Directory not empty: .../dist` and
    # `shim threw on require — Cannot find module .../dist/src/index.js` (a
    # different package each run, because shim-verify reads dist while build is
    # mid-rewrite). One turbo invocation dedupes the task graph instead of
    # racing it; shim-verify then runs strictly after every dist is final.
    # Everything else in this hook still runs in parallel.
    build-tests-shim-verify:
      run: npx --no turbo run build test --output-logs=errors-only && npm run --silent oxlint:shims:verify
    markdown-full:
      run: npm run --silent lint:md
    portability:
      run: npm run --silent audit:portability:ci
    lockfile:
      run: npm run --silent check-versions
    workflows:
      run: npm run --silent lint:workflows
    changelog:
      run: npm run --silent changeset:status
    shim-drift:
      run: npm run --silent oxlint:shims:check

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
