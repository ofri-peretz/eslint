# OSV-Scanner exceptions for the Supply-chain floor (quality.yml). Each one is time-boxed:
# past `ignoreUntil` the finding fails the gate again, so an exception cannot rot silently.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-04
reason = """
minimatch < 11.0.1 (medium). The only fixed line is 11.x, and the linters this repo is built
on have not moved to it: eslint 10.14.0 requires ^10.2.6, @eslint/config-array ^10.2.4,
@typescript-eslint/typescript-estree ^10.2.2. Forcing 11 through `overrides` would also reach
the v3 API that eslint-plugin-import / jsx-a11y / react still call, and break them.
No published package of ours depends on minimatch; it reaches only lint tooling and the
benchmark/compat lockfiles that pin old ESLint on purpose, and the patterns it matches are
this repo's own config globs, not user input. Revisit when eslint ships on minimatch 11, or
by the date above.
"""
