name: Commit via PR
description: >-
  Land a bot-generated change on main through a branch and a PR, instead of
  pushing straight at a protected branch.

# WHY THIS EXISTS
#
# Four scheduled workflows committed their snapshot and ran a bare `git push`
# at `main`. Branch protection declines that, and `enforce_admins` is enabled so
# no token is exempt:
#
#   remote: error: GH006: Protected branch update failed for refs/heads/main.
#    ! [remote rejected] main -> main (protected branch hook declined)
#
# Each job did its work correctly and then could not deliver it — `peer-health`
# (run 33411140440) and `resource-profile` (run 33502632167) both failed exactly
# there. The fix is not an exemption. A bot needing to bypass the gate is a
# reason to change how the bot delivers, not how the branch is protected.
#
# The mechanism is `docs-data.yml`'s, which has been landing changes this way
# for months. It is centralised here because its `--force-with-lease` handling
# encodes a lesson that is easy to get wrong on a re-implementation, and it now
# has four call sites.

inputs:
  branch:
    description: Branch to create or update. Stable per workflow, so reruns reuse one PR.
    required: true
  paths:
    description: Space-separated paths to stage.
    required: true
  commit-message:
    description: Commit subject. Must satisfy commitlint's scope-enum.
    required: true
  pr-title:
    description: Title for the PR when it is first opened.
    required: true
  pr-body:
    description: Body for the PR when it is first opened.
    required: true
  auto-merge:
    description: Enable auto-merge so a green snapshot lands unattended.
    required: false
    default: 'true'

outputs:
  changed:
    description: '"true" when there was something to commit.'
    value: ${{ steps.run.outputs.changed }}
  pr:
    description: The PR number, empty when nothing changed.
    value: ${{ steps.run.outputs.pr }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        PATHS: ${{ inputs.paths }}
        MESSAGE: ${{ inputs.commit-message }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        AUTO_MERGE: ${{ inputs.auto-merge }}
        # `npm ci` runs `lefthook install` via postinstall, so a bot commit was
        # executing the developer pre-commit and pre-push chains inside CI —
        # minutes of work whose checks this PR will run properly anyway, and one
        # more way for an unrelated flake to break an unattended job.
        LEFTHOOK: '0'
      run: |
        set -euo pipefail

        # shellcheck disable=SC2086 -- PATHS is deliberately word-split.
        if [ -z "$(git status --porcelain -- $PATHS)" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "pr=" >> "$GITHUB_OUTPUT"
          echo "Nothing to commit under: $PATHS"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Bare `--force-with-lease` compares against the remote-tracking ref and
        # rejects the push as "stale info" when it cannot resolve one.
        # actions/checkout makes a SINGLE-BRANCH clone, so that ref and the
        # refspec that would map it are both absent, and fetching the branch does
        # not help. Reading the lease explicitly keeps the create path working
        # (an empty value is the documented "must not exist yet" form) without
        # degrading into `--force`: a push that lands after this read is still
        # refused, which is the entire point of the lease.
        LEASE=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)

        git checkout -B "$BRANCH"
        # shellcheck disable=SC2086
        git add $PATHS
        git commit -m "$MESSAGE"
        git push --force-with-lease="$BRANCH:$LEASE" origin "$BRANCH"

        # `--base main --limit 1` matters: a bare `--head` lookup does not filter
        # by base and can return several numbers, which would put a multi-line
        # value into $PR and make every later `gh pr` call nonsense.
        find_pr() {
          gh pr list --head "$BRANCH" --base main --state open --limit 1 \
            --json number --jq '.[0].number // empty'
        }

        PR=$(find_pr)
        if [ -n "$PR" ]; then
          echo "Existing PR #$PR updated."
        else
          gh pr create --base main --head "$BRANCH" \
            --title "$PR_TITLE" --body "$PR_BODY"
          PR=$(find_pr)
        fi

        # Fail loudly rather than carrying an empty $PR forward, where it would
        # be swallowed below and reported as a successful run that landed nothing.
        if [ -z "$PR" ]; then
          echo "::error::Pushed $BRANCH but could not resolve its PR number."
          exit 1
        fi

        if [ "$AUTO_MERGE" = "true" ]; then
          # Idempotent: re-asserting is harmless and re-arms the PR after a
          # force-push resets its checks. Not fatal — the PR still exists.
          gh pr merge "$PR" --auto --squash || \
            echo "::warning::Could not enable auto-merge on #$PR; merge it manually."
        fi

        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "pr=$PR" >> "$GITHUB_OUTPUT"
