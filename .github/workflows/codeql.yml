# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CodeQL

# ─────────────────────────────────────────────────────────────────────────────
# Static security analysis. CodeQL is expensive (~4min wall) so it does NOT
# run on every PR push — it fires on the T3 "promote" gate (ready_for_review
# or `run-full-ci` label) and on a weekly Monday cron. Findings show up under
# Security → Code scanning.
#
# Why we want this on a security-focused plugin monorepo: our rules look for
# vulnerabilities — we should not be the source of any. CodeQL also catches
# JS/TS-level issues that ESLint won't (e.g. tainted-data flows across files).
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Every commit that lands on main is analysed. The PR triggers below are a
  # fast-feedback convenience and cannot stand alone: they skip draft PRs
  # without `run-full-ci`, and they never see a commit pushed straight to main
  # (automation commits, changeset releases). Those gaps are exactly what
  # Scorecard's SAST check measures — it reported 25 of 30 commits analysed.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [ready_for_review, labeled, synchronize]
  workflow_dispatch:
  schedule:
    # Weekly Monday 03:17 UTC — runs on a steady cadence regardless of activity,
    # so the security tab stays warm even on quiet weeks. Off-peak time keeps
    # us out of cron storms at the top of the hour.
    - cron: "17 3 * * 1"

concurrency:
  # Keyed on the SHA for push, the ref for everything else. Two merges landing
  # close together share a ref, so a ref-keyed group would cancel the first
  # commit's analysis and leave it permanently unscanned — reintroducing the
  # SAST gap this workflow's push trigger exists to close. Superseding a PR
  # push is fine; superseding a commit already on main is not.
  group: codeql-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$IS_DRAFT" == "false" ]] || [[ "$HAS_LABEL" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Draft PR without \`run-full-ci\` label — skipping CodeQL scan."
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"
