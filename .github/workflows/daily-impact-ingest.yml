# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Daily Impact Ingest

# Single source of truth for the North Star ratchet + impact metrics.
# Pulls daily numbers from NPM + GitHub + dev.to (+ PostHog), upserts into
# Supabase, then calls refresh_storefront_ratchet(). All consumer apps read
# from the v_* views — only this workflow writes.
#
# WHY THIS LIVES IN THE PUBLIC ESLINT REPO (moved from ofri-peretz/agents,
# 2026-07-17): (1) public repos have no GHA minutes quota, (2) this repo has
# daily activity, so the 60-day scheduled-workflow auto-disable can never
# silently kill the cron, (3) CI failures surface where the product work
# happens. The ingest SCRIPTS stay in the private control-room repo and are
# checked out at run time.
#
# Required repo secrets (https://github.com/ofri-peretz/eslint/settings/secrets/actions):
#   AGENTS_REPO_PAT           — PAT with read access to ofri-peretz/agents
#                                (private); used only for checkout + the
#                                GitHub metrics collector
#   SUPABASE_URL              — https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — full-access JWT; never exposed to frontend
#   DEVTO_API_KEY             — generate at https://dev.to/settings/extensions;
#                                daily-ingest skips dev.to gracefully if
#                                missing/expired
# Optional repo secret (collector skips gracefully if missing):
#   POSTHOG_API_KEY           — personal API key (phx_...), read-only scope

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch:

concurrency:
  group: daily-impact-ingest
  cancel-in-progress: false

permissions:
  contents: read
  # Required so the on-failure step can open / comment on a ci-failure issue.
  issues: write

jobs:
  ingest:
    name: Ingest into Supabase
    runs-on: ubuntu-latest
    # Capped at 10 min: last observed successful run was ~3m20s in the agents
    # repo; +1 min headroom for the cross-repo checkout. If runs creep past
    # 7 min, parallelize the npm loop before bumping this cap.
    timeout-minutes: 10
    steps:
      # The PAT expired on ~2026-07-30 and the ingest failed silently for six
      # days: `actions/checkout` reported only "Bad credentials" after three
      # retries, buried in a log nobody opens, while the failure issue said
      # just "Workflow failed". Downstream consumers kept serving the last
      # good Supabase numbers as if they were current, which is the dangerous
      # part — stale data looks exactly like fresh data.
      #
      # Check the token first and say precisely what is wrong and how to fix
      # it, so the cause is in the job's top-line error and in the issue.
      - name: Preflight — control-room PAT is valid
        env:
          AGENTS_REPO_PAT: ${{ secrets.AGENTS_REPO_PAT }}
        run: |
          if [ -z "${AGENTS_REPO_PAT}" ]; then
            echo "::error title=AGENTS_REPO_PAT is not set::Add a PAT with read access to ofri-peretz/agents at Settings → Secrets and variables → Actions."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${AGENTS_REPO_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ofri-peretz/agents)
          case "${status}" in
            200) echo "control-room PAT OK" ;;
            401) echo "::error title=AGENTS_REPO_PAT is expired or revoked::GitHub returned 401 Bad credentials. Mint a new fine-grained PAT with Contents:read on ofri-peretz/agents and update the AGENTS_REPO_PAT secret."; exit 1 ;;
            403) echo "::error title=AGENTS_REPO_PAT lacks access::GitHub returned 403. The token is valid but cannot read ofri-peretz/agents — grant it Contents:read on that repository."; exit 1 ;;
            404) echo "::error title=AGENTS_REPO_PAT cannot see ofri-peretz/agents::GitHub returned 404, which is what it returns for a private repo the token has no access to. Grant Contents:read on that repository."; exit 1 ;;
            *)   echo "::error title=Could not verify AGENTS_REPO_PAT::GitHub returned HTTP ${status}."; exit 1 ;;
          esac

      - name: Checkout control-room repo (private)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ofri-peretz/agents
          token: ${{ secrets.AGENTS_REPO_PAT }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # `npm install` instead of `npm ci`: the lockfile is generated on
      # macOS dev machines and misses Linux-only optional deps, which makes
      # ci fail. `npm install` drift-corrects on the runner.
      - run: npm install --no-audit --no-fund --include=optional
      - name: Run daily ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # PAT (not the auto token): the GitHub collector queries the
          # private control-room + cross-repo GraphQL the auto token can't.
          GITHUB_TOKEN: ${{ secrets.AGENTS_REPO_PAT }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: "428927"
          POSTHOG_HOST: https://us.i.posthog.com
        working-directory: footprint
        run: npm run footprint:ingest

      # Refresh the TRUE all-time npm download total (npm /downloads/range,
      # ≤18-month window per package, network-resilient). Non-fatal under
      # npm 429s (skips windows; the monotonic ratchet floors the cumulative).
      - name: Refresh all-time npm downloads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: footprint
        run: npm run footprint:alltime

      # Unattended cron — silent failures are dangerous. Auto-open (or
      # comment on existing) a GitHub issue tagged `ci-failure` so we get
      # the email notification + a persistent visible record.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = `[CI failure] ${context.workflow} — ${context.ref}`;
            // Name the step that actually failed and how long this has been
            // broken. The previous body was "Workflow failed" plus a run link,
            // which is why sixteen identical comments accumulated over six days
            // without anyone noticing the ingest had stopped: every comment
            // looked like the one before it, and none of them said why.
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
            });
            const failedSteps = jobs.jobs.flatMap((job) =>
              (job.steps ?? [])
                .filter((step) => step.conclusion === 'failure')
                .map((step) => `${job.name} → ${step.name}`),
            );

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'daily-impact-ingest.yml', per_page: 30,
            });
            const finished = runs.workflow_runs.filter((r) => r.conclusion !== null);
            let streak = 0;
            for (const run of finished) {
              if (run.conclusion !== 'failure') break;
              streak += 1;
            }

            const body = [
              failedSteps.length > 0
                ? `Workflow **${context.workflow}** failed at: **${failedSteps.join(', ')}**`
                : `Workflow **${context.workflow}** failed.`,
              ``,
              streak > 1
                ? `⚠️ **${streak} consecutive failures.** Supabase impact data has not advanced since the first one — every consumer is serving stale numbers as if they were current.`
                : `First failure in this run of the schedule.`,
              ``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Trigger: ${context.eventName}`,
              `- SHA: ${context.sha}`,
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure',
            });
            const hit = existing.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci-failure'],
              });
            }
