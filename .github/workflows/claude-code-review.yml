name: Claude Code Review

# AI code review on pull requests, powered by anthropics/claude-code-action.
#
# Activation: the job no-ops (green) until the CLAUDE_CODE_OAUTH_TOKEN secret
# exists, so this file is safe to merge before the secret + Claude GitHub App
# are wired. To enable:
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Generate a token locally: `claude setup-token`
#   3. Add it as the repo secret CLAUDE_CODE_OAUTH_TOKEN
#
# Billing: draws on the owner's Claude subscription monthly programmatic credit.
# With "extra usage" disabled (the default, Settings -> Usage), runs simply stop
# when the monthly credit is exhausted -- no overage is ever charged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # `review` is a REQUIRED check. A merge queue waits for every required check
  # to report on the `merge_group` event, so without this trigger the job never
  # runs, the context never arrives, and every queued merge blocks forever with
  # no error message. The job's own `if:` reads `github.event.pull_request`,
  # which does not exist on `merge_group`, so it skips — and a skipped required
  # check satisfies the queue. That is the intended behaviour, not an accident:
  # the review already ran on the PR, and re-reviewing the queue's synthetic
  # merge commit would spend the monthly credit to re-read an approved diff.
  merge_group:

concurrency:
  # One review per PR; cancel an in-flight review when a newer commit lands.
  #
  # `pull_request.number` is null on `merge_group`, which would collapse every
  # queue entry into one group named `claude-review-` and let them cancel each
  # other — a cancelled required check blocks the queue. `github.ref` is the
  # unique `gh-readonly-queue/...` branch, so entries stay independent.
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Skip draft PRs -- review once a PR is opened or marked ready for review.
    #
    # Also skip PRs opened by a bot. `claude-code-action` refuses non-human
    # actors outright ("Workflow initiated by non-human actor: github-actions
    # (type: Bot). Add bot to allowed_bots list...") and exits 1, so on a bot PR
    # this job does not decline to review -- it FAILS. That turned every
    # Changesets release PR red and blocked the publish, which is the one place
    # a red check must never be waved through.
    #
    # Skipping rather than adding the bot to `allowed_bots` is deliberate: a
    # version-bump PR is generated from changesets that were already reviewed on
    # the PR that introduced them. There is nothing there for a reviewer to find,
    # and paying for the review would be spending the monthly credit to read a
    # diff of version numbers.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for Claude token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::CLAUDE_CODE_OAUTH_TOKEN is not set. Add the secret and install the Claude GitHub App to enable automated reviews."
          fi

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Claude Code Review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in a published security &
            code-quality ESLint plugin ecosystem. Read the repository's
            CLAUDE.md / AGENTS.md for project conventions and honour them.

            Prioritise, in order:

            1. Correctness & security -- real bugs, broken edge cases,
               regressions, and security issues (injection, unsafe AST
               handling, secret leakage, ReDoS, prototype pollution). Map
               security findings to a CWE when you can.
            2. Regression locks -- this repo's contract is "lock everything you
               fix". If a change fixes a bug but adds no test that would fail on
               the unfixed code, flag it.
            3. Public-API & docs drift -- exported rule changes that don't
               update the rule's README, schema, or meta, and CLAUDE.md
               statements made stale by the change.

            Be precise and low-noise: only post a finding when you can cite the
            specific file:line and explain why it is wrong. Cap nits -- prefer a
            single summary line over many inline style comments. If you find no
            blocking issues, say so plainly.

            Post specific issues as inline comments; use one top-level comment
            for the summary.

            HOW TO READ THE DIFF. Do NOT run a bare `gh pr diff` — on a large
            PR that returns the whole diff as a single tool result and the run
            dies on input size before reviewing anything. This one reached
            1,727 files and 61,289 added lines, and the review errored six
            times in a row in 15-29s each.

            Instead:
              1. `gh pr diff --name-only` to list the changed files.
              2. Rank them by the priorities above — rule sources, schemas and
                 scripts first; generated output, lockfiles, baselines,
                 `benchmarks/results/**` and `docs/**` last, and skip them
                 entirely if the budget is thin.
              3. Read the ranked files with Read/Grep, or diff them one at a
                 time with `gh pr diff -- <path>`.
              4. Say in the summary how many files you actually read. A review
                 that silently covered a fraction of a large PR is worse than
                 one that says which fraction.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
