name: Claude Code Review

# AI code review on pull requests, powered by anthropics/claude-code-action.
#
# Activation: the job no-ops (green) until the CLAUDE_CODE_OAUTH_TOKEN secret
# exists, so this file is safe to merge before the secret + Claude GitHub App
# are wired. To enable:
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Generate a token locally: `claude setup-token`
#   3. Add it as the repo secret CLAUDE_CODE_OAUTH_TOKEN
#
# Billing: draws on the owner's Claude subscription monthly programmatic credit.
# With "extra usage" disabled (the default, Settings -> Usage), runs simply stop
# when the monthly credit is exhausted -- no overage is ever charged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # `review` is a REQUIRED check. A merge queue waits for every required check
  # to report on the `merge_group` event, so without this trigger the job never
  # runs, the context never arrives, and every queued merge blocks forever with
  # no error message. The job's own `if:` reads `github.event.pull_request`,
  # which does not exist on `merge_group`, so it skips — and a skipped required
  # check satisfies the queue. That is the intended behaviour, not an accident:
  # the review already ran on the PR, and re-reviewing the queue's synthetic
  # merge commit would spend the monthly credit to re-read an approved diff.
  merge_group:

concurrency:
  # One review per PR; cancel an in-flight review when a newer commit lands.
  #
  # `pull_request.number` is null on `merge_group`, which would collapse every
  # queue entry into one group named `claude-review-` and let them cancel each
  # other — a cancelled required check blocks the queue. `github.ref` is the
  # unique `gh-readonly-queue/...` branch, so entries stay independent.
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # Decide whether this diff is worth a review before spending ~120s and a
  # slice of the monthly credit on it.
  #
  # `review` is the CRITICAL PATH of PR CI. Measured 2026-09-03 over the last
  # eight merged PRs, it was 88-99% of end-to-end wall clock (median 124s on
  # success); all ~26 other checks finish inside its shadow. So the only diffs
  # worth paying that for are the ones a reviewer can actually find something
  # in.
  #
  # Over 60 merged PRs: 83% touched code, 13% were documentation only. Those
  # 13% pay full price for a reviewer reading prose — and one of them (#821)
  # was 100 files of it.
  #
  # NOT skipped for `.github/`-only diffs, though they are 3% and tempting.
  # Two CI outages on 2026-09-02 came from exactly that kind of change (an
  # unquoted colon that made a composite action unparseable, and a formatter
  # run that broke a lock). A workflow diff is the last place to remove a
  # reviewer.
  scope:
    name: Review scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -uo pipefail

          # No PR number means `merge_group`: the review already ran on the PR,
          # and re-reviewing the queue's synthetic merge commit would buy
          # nothing. The job below skips, and a skipped required check
          # satisfies the queue.
          if [ -z "${PR:-}" ]; then
            echo "merge_group — review already ran on the PR"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail OPEN. Every unexpected state here — API error, empty list, a
          # path shape not anticipated — must end in a review running, never in
          # one silently skipped. A gate that quietly disables the reviewer it
          # guards is worse than no gate.
          files=$(gh -R "$GITHUB_REPOSITORY" pr view "$PR" --json files \
                    --jq '.files[].path' 2>/dev/null) || files=""
          if [ -z "$files" ]; then
            echo "could not list changed files — reviewing to be safe"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Documentation only: Markdown anywhere, and the docs content tree.
          # Anything else — including .github/ — is code for this purpose.
          if printf '%s\n' "$files" | grep -qvE '(\.mdx?$|^docs/|^apps/docs/content/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "code in the diff — reviewing"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "documentation only ($(printf '%s\n' "$files" | wc -l) files) — skipping"
          fi
          printf '%s\n' "$files" | head -20

  review:
    needs: scope
    # Skip draft PRs -- review once a PR is opened or marked ready for review.
    #
    # Also skip PRs opened by a bot. `claude-code-action` refuses non-human
    # actors outright ("Workflow initiated by non-human actor: github-actions
    # (type: Bot). Add bot to allowed_bots list...") and exits 1, so on a bot PR
    # this job does not decline to review -- it FAILS. That turned every
    # Changesets release PR red and blocked the publish, which is the one place
    # a red check must never be waved through.
    #
    # Skipping rather than adding the bot to `allowed_bots` is deliberate: a
    # version-bump PR is generated from changesets that were already reviewed on
    # the PR that introduced them. There is nothing there for a reviewer to find,
    # and paying for the review would be spending the monthly credit to read a
    # diff of version numbers.
    if: >-
      needs.scope.outputs.run == 'true'
      && github.event.pull_request.draft == false
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for Claude token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::CLAUDE_CODE_OAUTH_TOKEN is not set. Add the secret and install the Claude GitHub App to enable automated reviews."
          fi

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # triggerlist diffs base...HEAD, so it needs the merge base. Blobless
          # keeps the full history cheap.
          fetch-depth: 0
          filter: blob:none

      # REVIEW.md promises the reviewer only the checklist items whose triggers
      # fire on this diff, read from the BASE branch so a PR cannot rewrite the
      # questions it is held to. This step keeps that promise. Fail open: if
      # triggerlist breaks, the review still runs, just without the list.
      - name: Triggered checklist
        id: checklist
        if: steps.token.outputs.present == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -uo pipefail
          git checkout "origin/$BASE_REF" -- .sdlc/checklist.yaml 2>/dev/null || true
          items=$(npx --yes triggerlist@1.0.1 match "origin/$BASE_REF" 2>&1) \
            || items="(triggerlist failed — review without the checklist)"
          printf '%s\n' "$items"
          { echo 'items<<TRIGGERLIST_EOF'; printf '%s\n' "$items"; echo 'TRIGGERLIST_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Claude Code Review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # track_progress inlines every PR comment into the prompt. CodeRabbit
          # posts long HTML reviews on every push, and on eslint#1574 they grew
          # the prompt from 60K to 477K characters (362K of it CodeRabbit). The
          # run then ends in under a second with is_error:true, $0 spent and no
          # model call, and this required check blocks the merge. The reviewer
          # reads the diff itself, so CodeRabbit's text adds nothing it needs.
          exclude_comments_by_actor: 'coderabbitai[bot]'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in a published security &
            code-quality ESLint plugin ecosystem.

            Programs already judge this PR: lint (oxlint, eslint and our own
            security plugins), typecheck, tests, CodeQL, mutation testing,
            changeset coverage and the fix-carries-a-test gate. Report nothing
            one of them would report. Spend the review on what only a reader
            can judge:

            1. Does the code do what the PR says it does? Logic and semantic
               bugs, broken edge cases, regressions.
            2. For a rule: a false positive or false negative on realistic
               code, and whether the rule decides from names or string values
               instead of what the code proves.
            3. Security reasoning that spans functions or files (injection,
               unsafe AST handling, secret leakage, prototype pollution). Map
               each finding to a CWE.
            4. A claim in docs or a README that the code does not back.

            Then answer each checklist question below. These fired on this
            diff. Where reading cannot settle one, name its `check` command
            for the author to run; you cannot run it here.

            ${{ steps.checklist.outputs.items }}

            Be precise and low-noise: only post a finding when you can cite the
            specific file:line and explain why it is wrong. Cite `path:line`
            ONLY for a finding, never to confirm something is correct:
            scripts/review-hit-rate.ts counts every citation as a finding. Cap nits -- prefer a
            single summary line over many inline style comments. If you find no
            blocking issues, say so plainly.

            Post specific issues as inline comments; use one top-level comment
            for the summary.

            HOW TO READ THE DIFF. Do NOT run a bare `gh pr diff` — on a large
            PR that returns the whole diff as a single tool result and the run
            dies on input size before reviewing anything. This one reached
            1,727 files and 61,289 added lines, and the review errored six
            times in a row in 15-29s each.

            Instead:
              1. `gh pr diff --name-only` to list the changed files.
              2. Rank them by the priorities above — rule sources, schemas and
                 scripts first; generated output, lockfiles, baselines,
                 `benchmarks/results/**` and `docs/**` last, and skip them
                 entirely if the budget is thin.
              3. Read the ranked files with Read/Grep, or diff them one at a
                 time with `gh pr diff -- <path>`.
              4. Say in the summary how many files you actually read. A review
                 that silently covered a fraction of a large PR is worse than
                 one that says which fraction.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
