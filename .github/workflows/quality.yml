# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Quality Gate

run-name: >-
  Quality · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event.head_commit.message }}

# ─────────────────────────────────────────────────────────────────────────────
# Fast-loop quality gate. Auto-runs on every PR push + push to main.
#
# Heavy jobs (Build, Tests, Typecheck, Portability Audit) have moved to
# `quality-full.yml` which only fires on a PR marked `ready_for_review` or
# labelled `run-full-ci`, plus weekly Sunday cron. Run them locally with
# `npm run ci:local` before promoting a PR.
#
# What stays auto here:
#   - oxlint (fast pass)        ~15s
#   - Markdown Lint             ~20s
#   - CHANGELOG Check           ~15s
#   - Workflow + script locks   ~30s
#   - Plugin Taxonomy           ~5s
#   - Lockfile Sync             ~10s
#   - Supply-chain floor        ~90s  (OSV + Scorecard offline checks)
#
# All of the above run in PARALLEL, so wall-clock is the slowest single job,
# not the sum. Supply-chain floor is the slowest at ~90s (image pull + scan);
# everything else still finishes in ~30s.
#
# Caching: `./.github/actions/setup` hydrates node_modules and (where used)
# the `.turbo` task cache. See AGENTS.md "Promotion gate" for the full model.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  oxlint:
    name: oxlint (fast pass)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run oxlint

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run lint:md

  changelog:
    name: CHANGELOG Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run audit:changelogs

  workflows:
    name: Workflow + CI Script Locks
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run lint:workflows
      # scripts/__tests__/ held five lock files but only oxlint-export-lock ran
      # in CI, via a `test:oxlint-exports` script that names a single file and
      # a path filter in oxlint-parity.yml. gap-closure, sync-source-versions
      # and turbo-cache-inputs-lock never ran anywhere — including the one
      # guarding the Turbo cache config. `test:scripts` runs the whole
      # directory (137 tests, ~13s) so a new lock is covered by existing.
      - run: npm run test:scripts

  publish-metadata:
    name: Publish Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run lint:publish

  taxonomy:
    name: Plugin Taxonomy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run lint:taxonomy
      # Same job rather than its own: both gates answer "is this rule allowed
      # to claim what it claims", both are pure static reads of the same rule
      # sources, and each runs in well under a second. A separate job would
      # spend more time on checkout and setup than on the check.
      - run: npm run lint:name-inference
      # Third gate on the same question, one layer down: a rule's DETECTION
      # TABLE is a list of claims, and this asks whether anything exercises
      # each one. #659 added twelve credential spellings and three reached the
      # PR with no test — removing them from the rule left the suite green.
      - run: npm run lint:detection-list-coverage
      # And the same question one layer out, on the LEDGER rather than the
      # rule: a triage verdict above a handful of findings has to say how
      # much of it was actually looked at. no-cycle carried "the DETECTION
      # is right" until the first sample read 66.7% wrong (#702, #705).
      - run: npm run lint:triage-sampling
      # The FULL rule-audit ratchet. The pre-commit hook runs a scoped version
      # that only sees rules whose own files changed; a shared-util edit can
      # move a rule's findings without touching it, so this run — every rule,
      # every check — is the one that actually holds the line.
      #
      # ~340ms of analysis over 121 rules, so it belongs in this job rather
      # than paying for its own checkout.
      - run: npm run rule-audit:gate

  recall:
    name: Detection Recall (CWE corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup
      # Guards the half a precision number cannot see. A sweep in August 2026
      # cut false positives from 10 to 3 on this corpus and took recall from
      # 73.9% to 50.7% at the same time — 16 labelled vulnerabilities silently
      # stopped being detected across 67 commits, because every narrowing looked
      # like an improvement on its own and nothing measured the other side.
      #
      # Fixtures are local and small, so unlike the network-heavy ILB-Wild run
      # this is cheap enough to block a PR. The 8-repo precision scan
      # (scripts/corpus-scan.ts) stays out of CI for that reason.
      # The corpus config imports each plugin's `dist/`, so an unbuilt tree makes
      # it unresolvable. The benchmark refuses to score in that state rather than
      # reporting zero findings — which is why this job failed in 18s on its first
      # run instead of silently passing with a perfect record.
      - name: Build the plugins the corpus config imports
        run: npx turbo build --filter='./packages/*'

      - name: Every CWE must still detect what it used to
        run: npx tsx scripts/recall-gate.ts

      # The precision counterpart. recall-gate asks whether the rules still
      # catch what they used to; this asks whether a rule is measured at all.
      # A rule with no corpus fixture has no precision number, so it can be
      # wrong about real code indefinitely and nothing moves. 62 of 374 had
      # evidence when this was added; the baseline may only shrink.
      #
      # It belongs in THIS job rather than Plugin Taxonomy: the other coverage
      # gates are static reads of rule sources, while this one actually loads
      # the plugins, so it needs the build above.
      - name: No rule may ship without corpus evidence
        run: npm run check:corpus-coverage

  lockfile:
    name: Lockfile Sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # Re-resolve package-lock.json from package.json without installing.
      # Any change indicates the lockfile is out of sync — the contributor
      # edited package.json but didn't run `npm install`.
      - name: Verify package-lock.json is in sync
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --exit-code --quiet package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json."
            echo ""
            echo "Run \`npm install\` locally and commit the updated lockfile."
            echo ""
            echo "--- Diff (truncated to 80 lines) ---"
            git --no-pager diff package-lock.json | head -80
            exit 1
          fi
          echo "✅ Lockfile is in sync."

  # ───────────────────────────────────────────────────────────────────────────
  # Supply-chain floor. Runs as a sibling of the other fast gates, so it costs
  # wall-clock only if it is the slowest one.
  #
  # Two assertions, both regressions this repo has actually suffered:
  #   1. OSV over every committed lockfile. Two stale workspace-member
  #      lockfiles carried 29 findings for ~8 months while `npm audit` showed
  #      one low, because npm never reads those files and OSV-Scanner reads all
  #      of them. Nothing in CI disagreed.
  #   2. Scorecard per-check floors, for the offline-evaluable checks. The work
  #      that moved the aggregate 6.8 -> 8.5 is otherwise unguarded.
  # ───────────────────────────────────────────────────────────────────────────
  supply-chain:
    name: Supply-chain floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scans the checked-out tree only — no `npm ci`, so this sees committed
      # lockfiles and nothing from node_modules. Exits non-zero on any finding.
      - name: OSV — no known vulnerabilities in any committed lockfile
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

      # Pinned by digest, not tag: this job enforces Pinned-Dependencies, so it
      # has no business pulling a mutable image itself.
      - name: Scorecard — offline checks
        env:
          SCORECARD_IMAGE: gcr.io/openssf/scorecard@sha256:b9a535801cb5fc8e7b2bea4cf45dd2db9a342cab8cc32bb5be2ac1355a95356f
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE":/repo "$SCORECARD_IMAGE" \
            --local=/repo --format=json \
            --checks=Dangerous-Workflow,Token-Permissions,Binary-Artifacts,Security-Policy,Pinned-Dependencies \
            > scorecard.json

      - name: Scorecard — enforce per-check floors
        run: |
          set -euo pipefail
          node scripts/check-scorecard-floor.mjs scorecard.json | tee -a "$GITHUB_STEP_SUMMARY"

  bench-size:
    name: Results size guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run check:benchmark-results-size

  # Aggregate gate so branch protection has a single required check to gate on.
  # Heavy gates (test/build/typecheck/portability) live in quality-full.yml.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [oxlint, markdown, changelog, workflows, taxonomy, publish-metadata, lockfile, supply-chain, recall, bench-size]
    if: always()
    steps:
      - name: Render gate report
        env:
          R_OXLINT: ${{ needs.oxlint.result }}
          R_MARKDOWN: ${{ needs.markdown.result }}
          R_CHANGELOG: ${{ needs.changelog.result }}
          R_WORKFLOWS: ${{ needs.workflows.result }}
          R_TAXONOMY: ${{ needs.taxonomy.result }}
          R_PUBLISH: ${{ needs.publish-metadata.result }}
          R_LOCKFILE: ${{ needs.lockfile.result }}
          R_SUPPLY: ${{ needs.supply-chain.result }}
          R_RECALL: ${{ needs.recall.result }}
          R_BENCH_SIZE: ${{ needs.bench-size.result }}
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⏹" ;;
              skipped)   echo "⏭" ;;
              *)         echo "⚠️" ;;
            esac
          }

          all_pass=true
          for r in "$R_OXLINT" "$R_MARKDOWN" "$R_CHANGELOG" "$R_WORKFLOWS" "$R_TAXONOMY" "$R_PUBLISH" "$R_LOCKFILE" "$R_SUPPLY" "$R_RECALL" "$R_BENCH_SIZE"; do
            [ "$r" = "success" ] || all_pass=false
          done
          if $all_pass; then
            header="✅ Fast quality gates passed"
          else
            header="❌ One or more fast quality gates failed"
          fi

          {
            echo "# $header"
            echo ""
            echo "| Gate | Result | Notes |"
            echo "|---|---|---|"
            echo "| oxlint              | $(icon "$R_OXLINT") $R_OXLINT           | fast lint pass (Rust-native) |"
            echo "| Markdown lint       | $(icon "$R_MARKDOWN") $R_MARKDOWN       | \`markdownlint-cli2\` |"
            echo "| CHANGELOG present   | $(icon "$R_CHANGELOG") $R_CHANGELOG     | every published package has CHANGELOG.md |"
            echo "| Workflow + script locks | $(icon "$R_WORKFLOWS") $R_WORKFLOWS | \`lint-workflows.ts\` + \`scripts/__tests__\` |"
            echo "| Plugin taxonomy     | $(icon "$R_TAXONOMY") $R_TAXONOMY       | code-agnostic plugins carry no SDK gates |"
            echo "| Publish metadata    | $(icon "$R_PUBLISH") $R_PUBLISH         | no package publishes with an npm warning |"
            echo "| Lockfile sync       | $(icon "$R_LOCKFILE") $R_LOCKFILE      | \`package-lock.json\` matches \`package.json\` |"
            echo "| Supply-chain floor  | $(icon "$R_SUPPLY") $R_SUPPLY          | OSV clean + Scorecard checks above floor |"
            echo "| Detection recall    | $(icon "$R_RECALL") $R_RECALL          | no CWE detects less than it used to |"
            echo "| Results size guard  | $(icon "$R_BENCH_SIZE") $R_BENCH_SIZE      | benchmarks/results/ under 20 MiB |"
            echo ""
            echo "_Heavy gates (build/tests/typecheck/portability) run via \`quality-full.yml\` when this PR is promoted (ready-for-review or \`run-full-ci\` label)._"
            if ! $all_pass; then
              echo ""
              echo "**Investigate failures via the per-gate jobs above.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          $all_pass || { echo "::error::One or more quality gates failed"; exit 1; }
          echo "All quality gates passed."
