# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Affected Packages

# Dynamic title shown in the Actions list — distinguishes auto-fired pushes
# from manual dry-runs at a glance, and surfaces the dist-tag for non-latest
# releases.
run-name: >-
  Release${{ inputs.dry-run && ' (dry-run)' || '' }} · ${{ inputs.dist-tag || 'latest' }} · ${{ github.event_name == 'push' && github.event.head_commit.message || github.actor }}

# ═══════════════════════════════════════════════════════════════════════════════
# TURBO + MATRIX-PARALLEL RELEASE WORKFLOW
# ═══════════════════════════════════════════════════════════════════════════════
#
# Triggers automatically on every push to main (typically the merge of a
# changesets-managed "Version Packages" PR). The detect stage compares each
# package's local `version` field against npm's published version and only
# fans out for packages that actually changed — so non-release pushes are a
# fast no-op.
#
# Four-stage pipeline:
#
#   1. detect       — diff package.json versions vs npm; emit JSON matrix of
#                     publishable packages.
#   2. build        — run `turbo run build --affected` once (Turbo dedupes
#                     across packages); upload `dist/` as a single artifact.
#   3. publish (×N) — matrix fan-out: ONE job per package, all in parallel.
#                     Each job downloads dist, npm-publishes its own package,
#                     and tags the release.
#   4. summarize    — single rollup job posting the result.
#
# Dependency order: `@interlace/eslint-devkit` is consumed by other packages,
# but at PUBLISH time we ship pre-built `dist/` artifacts — there is no
# build-time interaction between the publish jobs, so parallelism is safe.
# Turbo's `^build` already ensures consumers built against the new devkit
# before we got here.
#
# Authentication:
#   - Trusted Publishers (OIDC) for existing packages — no token needed.
#   - NPM_TOKEN fallback for first-release packages.
#
# Manual override: workflow_dispatch with dry-run=true lets you preview
# what would publish without actually shipping anything (useful for
# debugging the detect logic).
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: build + show what would publish, but don't publish."
        required: false
        type: boolean
        default: false
      dist-tag:
        description: 'NPM distribution tag.'
        required: false
        type: choice
        options: [latest, next, beta, rc, alpha]
        default: latest

concurrency:
  group: release-workflow
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_CONCURRENCY: '4'
  # Turbo Remote Cache — see quality.yml for setup notes. Pulls build
  # artefacts the Quality Gate already produced for the same SHA, so the
  # release "build affected" stage usually returns instantly.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 1 — Detect publishable packages.
  # Fast path: doesn't require building. Just compares local versions to npm.
  # ─────────────────────────────────────────────────────────────────────────
  detect:
    name: Detect publishable packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      - name: Diff local versions vs npm
        id: detect
        run: |
          set -euo pipefail
          publish=()
          for pkg_json in packages/*/package.json; do
            dir=$(dirname "$pkg_json")
            pkg=$(basename "$dir")

            is_private=$(node -p "require('./$pkg_json').private === true" 2>/dev/null || echo false)
            [ "$is_private" = "true" ] && continue

            name=$(node -p "require('./$pkg_json').name")
            local_ver=$(node -p "require('./$pkg_json').version")
            npm_ver=$(npm view "$name" version 2>/dev/null || echo "")

            if [ -z "$npm_ver" ]; then
              echo "🆕 $name: first release ($local_ver)"
              publish+=("{\"dir\":\"$pkg\",\"name\":\"$name\",\"version\":\"$local_ver\"}")
              continue
            fi

            cmp=$(node -e "
              const semver = require('semver');
              if (semver.gt('$local_ver', '$npm_ver')) console.log('ahead');
              else if (semver.eq('$local_ver', '$npm_ver')) console.log('same');
              else console.log('behind');
            " 2>/dev/null || echo error)

            case "$cmp" in
              ahead)
                echo "📦 $name: $npm_ver → $local_ver"
                publish+=("{\"dir\":\"$pkg\",\"name\":\"$name\",\"version\":\"$local_ver\"}")
                ;;
              same)    echo "✅ $name: $local_ver (already published)" ;;
              behind)  echo "⚠️  $name: local $local_ver < npm $npm_ver (skip)" ;;
              *)       echo "❌ $name: comparison error (skip)" ;;
            esac
          done

          count=${#publish[@]}
          if [ "$count" -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            json=$(IFS=,; echo "[${publish[*]}]")
            echo "matrix={\"include\":$json}" >> "$GITHUB_OUTPUT"
            echo "count=$count" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 2 — Build affected packages once and upload dist/ artifact.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build affected
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup

      - name: Build packages
        # `--affected` is wrong here: on a workflow_dispatch from main there's
        # no diff base, so turbo computes 0 affected and the dist upload below
        # fails with "no files matched". Build all workspace packages instead
        # (apps/* are intentionally excluded — they're not published to npm).
        # `^build` still ensures deps like @interlace/eslint-devkit build first.
        run: npx turbo run build --filter='./packages/*'

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: packages/*/dist/
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 2.5 — Pre-publish ecosystem-integrity gate against the BUILT dist/.
  #
  # The vitest `ecosystem-integrity.test.ts` lock runs against workspace
  # SOURCE (its vitest config aliases every plugin to `src/index.ts`), so it
  # can't catch a stale/mis-built artifact — the exact failure mode that
  # shipped broken `recommended` builds of maintainability/operability to npm
  # while their source was already fixed. This job re-runs the same assertions
  # against the freshly-built `dist/` from STAGE 2, under EVERY supported
  # ESLint major (8/9/10 per docs/ESLINT_VERSION_SUPPORT.md). A
  # plugin-key ↔ rule-prefix mismatch throws "Could not find plugin …" here
  # and blocks the publish fan-out. See docs/PRE_PUBLISH_INTEGRITY_GATE.md.
  # ─────────────────────────────────────────────────────────────────────────
  integrity:
    name: Dist integrity (eslint-${{ matrix.eslint }})
    needs: [detect, build]
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        # Every supported ESLint major. Installed with `--no-save` so the
        # lockfile is never touched (verified: hash-identical, git-clean).
        eslint: ['8', '9', '10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      - name: Restore dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: packages/

      - name: Install ESLint ${{ matrix.eslint }} (no lockfile churn)
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "eslint@^${{ matrix.eslint }}"
          node -e "console.log('eslint@' + require('eslint/package.json').version)"

      - name: Run dist integrity gate
        # --require-built: every published plugin MUST have a built dist/ here,
        # since STAGE 2 just built them. A missing dist/ is a hard release stop.
        run: npm run verify:dist-integrity:release

      - name: Published-artifact gate
        # Runs on the EXACT artifact STAGE 2 built and STAGE 3 will publish —
        # the only place this can be checked with certainty. Locally, any
        # `tsc --build` over the solution (e.g. `npm run typecheck`) re-emits
        # into dist/ and undoes build-package.ts's post-processing; a rebuild
        # restores it. Here nothing re-runs tsc, so what is checked is what
        # ships.
        run: npm run check-published-artifacts

      - name: Artifact size report
        # Advisory only — never blocks a release. Bundles legitimately grow;
        # this exists so growth is a decision rather than a surprise.
        continue-on-error: true
        run: npm run check-artifact-size

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 3 — Publish each package in parallel (matrix fan-out).
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish ${{ matrix.name }}@${{ matrix.version }}
    needs: [detect, build, integrity]
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write # for git tag push
      id-token: write # for npm Trusted Publishers (OIDC)
    strategy:
      # Don't cancel siblings on a single publish failure — partial releases
      # are recoverable, but losing successful publishes to a sibling's failure
      # is not.
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: npm

      # ponytail: no `npm install -g npm@latest` — OIDC/provenance needs npm
      # >= 11.5, and the .nvmrc-pinned Node (24.13 → npm 11.6.2) already ships
      # it. The upgrade was redundant AND flaky (npm@latest is a moving target;
      # it broke every publish job in run 29604777079). If .nvmrc ever drops
      # below Node bundling npm 11.5, re-pin npm here instead of chasing latest.

      - name: Restore dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: packages/

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish ${{ matrix.name }}@${{ matrix.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          # On workflow_dispatch, inputs.* carry user-supplied values.
          # On push, they default to false / "latest" (real release).
          DRY_RUN: ${{ inputs.dry-run || false }}
          DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
          PKG_DIR: packages/${{ matrix.dir }}/dist
          PKG_NAME: ${{ matrix.name }}
          PKG_VER: ${{ matrix.version }}
        run: |
          set -euo pipefail
          if [ ! -d "$PKG_DIR" ]; then
            echo "::error::Missing $PKG_DIR — build artifact incomplete."
            exit 1
          fi
          # tag format: <unscoped-name>@<version>, e.g. "eslint-plugin-node-security@1.2.3"
          tag_name="${PKG_NAME##*/}@${PKG_VER}"

          echo "═════════════════════════════════════════════════════════"
          echo "📦 $PKG_NAME@$PKG_VER (dist-tag: $DIST_TAG)"
          echo "═════════════════════════════════════════════════════════"

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 [dry-run] would publish $PKG_NAME@$PKG_VER"
            (cd "$PKG_DIR" && npm publish --dry-run --tag "$DIST_TAG" --access public)
            exit 0
          fi

          # Idempotency: if this exact version is already on npm, skip without
          # error. Keeps re-runs after partial failures safe.
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "✅ $PKG_NAME@$PKG_VER already on npm — skipping publish."
          else
            (cd "$PKG_DIR" && npm publish --tag "$DIST_TAG" --access public --provenance)
          fi

          # RECORD THE PUBLISH BEFORE ANYTHING THAT CAN FAIL.
          #
          # Everything below this line — tagging, pushing the tag, creating the
          # GitHub release — can fail, and when it does the job goes red with
          # the package already public and unrecallable. On 2026-08-31 that
          # happened to six packages at once: run 33346361671 reported six
          # `failure` publish jobs and all six versions were on npm, published
          # by the Actions OIDC identity with SLSA provenance.
          #
          # A reader then has only the job status, and the job status says the
          # opposite of what happened. It cost this session hours: the red run
          # was read as "the release never went out", which sent the whole
          # investigation the wrong way.
          #
          # $GITHUB_STEP_SUMMARY is written immediately and survives a later
          # failure in the same job, so the run page states the truth even when
          # the conclusion is `failure`. See
          # docs/intents/2026-08-31-a-red-release-must-mean-nothing-shipped.md
          echo "PUBLISHED — \`$PKG_NAME@$PKG_VER\` is on npm. Steps after this point (git tag, GitHub release) may still fail; that does NOT un-publish it." >> "$GITHUB_STEP_SUMMARY"

          # Tag in git (idempotent — fail-soft if tag already exists).
          if git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null; then
            echo "(local tag $tag_name already exists)"
          else
            git tag -a "$tag_name" -m "Release $tag_name"
          fi
          # Push the tag, then VERIFY it landed. The previous line was
          #
          #   git push origin "$tag_name" || echo "(tag push failed — likely already on remote)"
          #
          # which asserted the reassuring guess instead of checking it. Nine
          # matrix jobs push tags to the same remote at once; five of nine lost
          # that race on 2026-08-23, the `||` reported "likely already on
          # remote", and the release step three lines below then died with
          # "tag exists locally but has not been pushed". npm had every package;
          # GitHub had no tag and no release for five of them.
          #
          # Contention is expected here, so retry — and if the tag still is not
          # on the remote afterwards, say so rather than continue.
          for attempt in 1 2 3; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag_name" >/dev/null 2>&1; then
              echo "✅ tag $tag_name is on the remote"
              break
            fi
            echo "pushing tag $tag_name (attempt $attempt)…"
            git push origin "$tag_name" 2>&1 || true
            sleep $(( attempt * 3 ))
          done
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag_name" >/dev/null 2>&1; then
            echo "::warning::tag $tag_name never reached the remote; the release step will create it from $GITHUB_SHA"
          fi

          # Stash the tag name + the per-version CHANGELOG slice for the
          # GitHub Release step that follows. We use --fallback so a missing
          # CHANGELOG section produces a generic stub rather than failing
          # the whole publish.
          mkdir -p .release-notes
          notes_file=".release-notes/${tag_name//\//_}.md"
          npx tsx scripts/extract-changelog.ts "packages/${{ matrix.dir }}" "$PKG_VER" --fallback > "$notes_file"
          # The changeset says what changed, in our words. This says which PRs it
          # arrived in — the question someone asks when a false positive they
          # reported stops appearing, and one a CHANGELOG entry cannot answer.
          npx tsx scripts/prs-since-release.ts "packages/${{ matrix.dir }}" "$PKG_VER" >> "$notes_file"
          echo "TAG_NAME=$tag_name" >> "$GITHUB_ENV"
          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.name }}
          PKG_VER: ${{ matrix.version }}
          DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
        run: |
          set -euo pipefail
          # Idempotent: if the release already exists for this tag, just
          # update its body (handy for re-runs after a flaky publish).
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "↻ Release $TAG_NAME exists — updating notes."
            gh release edit "$TAG_NAME" \
              --notes-file "$NOTES_FILE" \
              --title "$PKG_NAME@$PKG_VER"
          else
            echo "🆕 Creating release $TAG_NAME"
            # `--latest=false` avoids each per-package release stealing
            # the repo-wide "Latest" badge; the most-recent overall is
            # marked latest by GitHub automatically.
            #
            # `--prerelease` for non-`latest` dist-tags keeps these out of
            # the default release page view.
            extra_flags=()
            if [ "$DIST_TAG" != "latest" ]; then
              extra_flags+=(--prerelease)
            fi
            # `--target` is what makes this survive a lost tag-push race: with
            # it, GitHub creates the tag itself from the commit rather than
            # requiring one to already be on the remote. Without it the step
            # fails AFTER a successful npm publish, which is the worst place to
            # fail — the package is public and unrecallable while the repo has
            # no tag to diff against.
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$PKG_NAME@$PKG_VER" \
              --notes-file "$NOTES_FILE" \
              --latest=false \
              "${extra_flags[@]}"
          fi

      - name: Job summary
        if: always()
        env:
          PKG_NAME: ${{ matrix.name }}
          PKG_VER: ${{ matrix.version }}
          DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # NOTES_FILE is set by the publish step; with `if: always()` this
          # summary runs even when publish failed before setting it, so the
          # `set -u` guard above would otherwise error with "NOTES_FILE:
          # unbound variable" and mask the real publish failure.
          NOTES_FILE="${NOTES_FILE:-}"
          status="✅ published"
          [ "$DRY_RUN" = "true" ] && status="🔍 dry-run"

          npm_url="https://www.npmjs.com/package/${PKG_NAME}/v/${PKG_VER}"
          tag_short="${PKG_NAME##*/}@${PKG_VER}"
          gh_url="https://github.com/${REPO}/releases/tag/${tag_short}"

          {
            echo "## $status — \`$PKG_NAME@$PKG_VER\`"
            echo ""
            echo "| | |"
            echo "|--|--|"
            echo "| **Dist-tag**     | \`$DIST_TAG\` |"
            echo "| **npm**          | [$PKG_NAME@$PKG_VER]($npm_url) |"
            echo "| **GitHub Release** | [$tag_short]($gh_url) |"
            echo "| **Provenance**   | [\`--provenance\` enabled](https://docs.npmjs.com/generating-provenance-statements) |"
            echo ""
            if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
              echo "<details><summary>Release notes</summary>"
              echo ""
              cat "$NOTES_FILE"
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 4 — Summary.
  # ─────────────────────────────────────────────────────────────────────────
  summarize:
    name: Release summary
    needs: [detect, build, publish]
    if: always() && needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the rollup GitHub Release + its tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      - name: Write rollup
        env:
          MATRIX: ${{ needs.detect.outputs.matrix }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Resolve overall status emoji.
          if [ "$DRY_RUN" = "true" ]; then
            status_label="🔍 Dry run"
          elif [ "$PUBLISH_RESULT" = "success" ]; then
            status_label="✅ Released"
          elif [ "$PUBLISH_RESULT" = "failure" ]; then
            status_label="❌ Failed"
          elif [ "$PUBLISH_RESULT" = "cancelled" ]; then
            status_label="⏹ Cancelled"
          else
            status_label="⚠️ $PUBLISH_RESULT"
          fi

          {
            echo "# $status_label · ${{ needs.detect.outputs.count }} package(s)"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` by @${ACTOR} |"
            echo "| Mode | ${DRY_RUN:+dry-run}${DRY_RUN:-publish} |"
            echo "| Dist-tag | \`$DIST_TAG\` |"
            echo "| Build | $BUILD_RESULT |"
            echo "| Publish (matrix) | $PUBLISH_RESULT |"
            echo ""
            echo "## Packages"
            echo ""
            echo "| Package | Version | npm | GH Release |"
            echo "|---|---|---|---|"
            # Iterate the matrix that detect emitted. jq tolerates the
            # empty-include case (count == 0 is excluded by the job's `if:`).
            echo "$MATRIX" | jq -r --arg repo "$REPO" '
              .include[]?
              | "| \(.name) | \(.version) | [npm](https://www.npmjs.com/package/\(.name)/v/\(.version)) | [\(.name | sub("^@[^/]+/"; ""))@\(.version)](https://github.com/\($repo)/releases/tag/\(.name | sub("^@[^/]+/"; ""))@\(.version)) |"
            '
            echo ""
            if [ "$PUBLISH_RESULT" != "success" ] && [ "$DRY_RUN" != "true" ]; then
              echo "## ⚠️ Recovery"
              echo ""
              echo "If a publish failed mid-flight, re-running this workflow is safe — every step is idempotent:"
              echo ""
              echo "\`\`\`bash"
              echo "npm run release           # re-run via workflow_dispatch"
              echo "npm run release:status    # see what's still pending"
              echo "\`\`\`"
              echo ""
              echo "If tags / npm / GH Releases drift, the weekly \`release-hygiene.yml\` workflow opens a tracking issue + can backfill."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ───────────────────────────────────────────────────────────────────
      # Cross-package rollup.
      #
      # The per-package Releases created in STAGE 3 answer "what changed in
      # eslint-plugin-jwt-security@3.1.0?". Nothing answered "what shipped in
      # this release?" — a 19-package release produced 19 disconnected pages.
      # This creates the one page that bundles them, grouped by kind
      # (breaking / features / fixes) rather than by package, and including
      # the private packages and apps that never get an npm Release of their
      # own. See scripts/release-notes.ts.
      # ───────────────────────────────────────────────────────────────────
      - name: Build rollup release notes
        id: rollup
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # On workflow_dispatch there is no `before`; fall back to the parent
          # commit, which for a Version-PR merge is the pre-release state.
          base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          npx tsx scripts/release-notes.ts --since="$base" > rollup-notes.md
          cat rollup-notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Build machine-readable rollup
        # The GitHub Releases API and releases.atom already expose *that* a
        # release happened. What they cannot express is this rollup's shape —
        # entries grouped by kind, deduplicated across packages, with the
        # workspace-version table. Attaching it as an asset makes the grouped
        # view consumable by the docs site and by agents without re-parsing 20
        # markdown changelogs.
        run: npx tsx scripts/release-notes.ts --since="${{ steps.rollup.outputs.base }}" --json > rollup.json

      - name: Publish rollup GitHub Release
        # Only for real, successful releases. A dry-run must not create a tag,
        # and a failed fan-out has nothing coherent to roll up.
        if: ${{ !inputs.dry-run && needs.publish.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ needs.detect.outputs.count }}
          # Optional. Set this repo variable to a Discussions category name
          # (e.g. `Releases`) to open a feedback thread on every rollup. Left
          # empty — or with Discussions disabled — the release is created
          # exactly as before.
          DISCUSSION_CATEGORY: ${{ vars.RELEASE_DISCUSSION_CATEGORY }}
        run: |
          set -euo pipefail
          # Date-stamped tag, disambiguated by the short SHA so two releases on
          # the same day don't collide. Distinct from the per-package
          # `<name>@<version>` namespace that release-hygiene.yml reconciles.
          tag="release-$(git log -1 --format=%cd --date=format:%Y-%m-%d)-$(git rev-parse --short HEAD)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file rollup-notes.md --latest
            echo "↻ Updated rollup release $tag"
          else
            # `--latest` explicitly. Every per-package release passes
            # `--latest=false`, and nothing claimed the badge — so which release
            # GitHub showed as "Latest" was decided by whichever job happened to
            # finish last. The rollup is the one release that describes the
            # whole thing, so it should hold the badge on purpose.
            #
            # `--discussion-category` is attempted only when the variable is
            # set, and falls back to a plain create: the flag errors outright if
            # Discussions is disabled or the category does not exist, and a
            # feedback thread is not worth failing a release that already
            # published to npm.
            created=false
            if [ -n "${DISCUSSION_CATEGORY:-}" ]; then
              if gh release create "$tag" \
                   --title "Release $tag · ${COUNT} package(s)" \
                   --notes-file rollup-notes.md \
                   --latest \
                   --discussion-category "$DISCUSSION_CATEGORY"; then
                created=true
                echo "🆕 Created rollup release $tag (with discussion)"
              else
                echo "::warning::Could not open a release discussion in category '${DISCUSSION_CATEGORY}'. Is Discussions enabled and the category present? Creating the release without one."
              fi
            fi

            if [ "$created" = "false" ]; then
              gh release create "$tag" \
                --title "Release $tag · ${COUNT} package(s)" \
                --notes-file rollup-notes.md \
                --latest
              echo "🆕 Created rollup release $tag"
            fi
          fi
          # Idempotent: --clobber replaces the asset on a re-run.
          gh release upload "$tag" rollup.json --clobber
          echo "[$tag](https://github.com/${{ github.repository }}/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the release notes that just published
        # Everything upstream of the publish is unit-tested; nothing tested the
        # artifact. Every defect found in this system so far was found by
        # opening the published page and reading it — this is that reading,
        # automated, against exactly the tags this run created (not the latest
        # N, which would re-report pre-#660 releases forever).
        #
        # Advisory: the packages are on npm by now, so a red X here cannot
        # un-publish anything and would only teach people to ignore red Xs.
        if: ${{ !inputs.dry-run && needs.publish.result == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.detect.outputs.matrix }}
        run: |
          set -uo pipefail
          tags=$(echo "$MATRIX" | jq -r '[.include[]? | "\(.name | sub("^@[^/]+/"; ""))@\(.version)"] | join(",")')
          rollup="release-$(git log -1 --format=%cd --date=format:%Y-%m-%d)-$(git rev-parse --short HEAD)"

          npx tsx scripts/verify-release-notes.ts --tags="${tags},${rollup}" 2>&1 | tee notes-check.txt
          {
            echo ""
            echo "<details><summary>Release-note verification</summary>"
            echo ""
            echo '```'
            cat notes-check.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tags / npm / Releases agree
        # release-hygiene.yml runs this same reconciliation weekly, which means
        # a partially-failed release could sit undetected for up to seven days.
        # Running it here costs one job step and catches the drift while the
        # run that caused it is still on screen. Report-only: the packages are
        # already published, so the useful output is a diagnosis, not a red X.
        if: ${{ !inputs.dry-run && needs.publish.result == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          npm run --silent release:reconcile 2>&1 | tee reconcile.txt
          {
            echo ""
            echo "<details><summary>Tag / npm / Release reconciliation</summary>"
            echo ""
            echo '```'
            cat reconcile.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate release in PostHog
        # Advisory: the packages are already on npm by this point, so a
        # missing analytics marker must never fail the run. The script exits 0
        # on every error path; `continue-on-error` covers a crash before that.
        if: ${{ !inputs.dry-run && needs.publish.result == 'success' }}
        continue-on-error: true
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          COUNT: ${{ needs.detect.outputs.count }}
          MATRIX: ${{ needs.detect.outputs.matrix }}
        run: |
          set -euo pipefail
          names=$(echo "$MATRIX" | jq -r '[.include[]?| "\(.name)@\(.version)"] | join(", ")')
          npx tsx scripts/posthog-annotate.ts \
            --content="📦 npm release · ${COUNT} package(s): ${names}"
