name: Peer health snapshot

# Captures maintenance-health metrics for the ESLint plugin peers named
# in `distribution/ECOSYSTEM_LANDSCAPE.md`. Closes the §9 (Adoption &
# maintenance health) gaps documented in `distribution/EVALUATION_METRICS.md`.
#
# Trigger: weekly on Mondays. No PR trigger — this is monitoring, not
# pre-merge gating; failures here should not block development.

on:
  schedule:
    # Mondays 08:00 UTC — early enough to be ready for weekly planning
    # but well outside business-hours rate windows.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch and commit peer-health snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # commit the snapshot
      pull-requests: write   # open/update the snapshot PR
      issues: write          # open/comment the failure issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc

      - name: Install (no audit / fund — we only need tsx)
        run: npm ci --no-audit --no-fund

      - name: Authenticate gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The default GITHUB_TOKEN scope is enough for repos/* reads.
          echo "gh auth uses GITHUB_TOKEN env var (already authenticated)."
          gh auth status || true

      - name: Run peer-health fetcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run peer-health

      # Was a bare `git push` at main, which branch protection declines with
      # GH006 — the fetch succeeded and the snapshot was thrown away. The job
      # already asks for `pull-requests: write` for "the snapshot PR"; this is
      # the step finally using it.
      - name: Commit snapshot if changed
        uses: ./.github/actions/commit-via-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: automated/peer-health-snapshot
          paths: benchmark-results/peer-health.json benchmark-results/peer-health.md
          commit-message: "chore(benchmarks): refresh peer-health snapshot"
          pr-title: "chore(benchmarks): refresh peer-health snapshot"
          pr-body: |
            Automated weekly refresh of the peer-plugin health metrics named in
            `distribution/ECOSYSTEM_LANDSCAPE.md`. Source data from the npm
            registry + GitHub API.

            Contents come entirely from `npm run peer-health`, so review the diff
            rather than hand-editing.

      # A scheduled refresher that fails notifies nobody by default. This one failed
      # every run for months — the commit step used a scope commitlint rejected — and
      # the snapshot it exists to refresh silently stopped moving. One issue, reopened
      # and commented rather than a new one per run, same shape as integration-health.
      - name: 🚨 Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="peer-health snapshot refresh is failing"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n\n[Run](%s)\n' \
            "The weekly peer-health refresher failed, so `benchmark-results/peer-health.{json,md}` is now stale. Those numbers back `distribution/ECOSYSTEM_LANDSCAPE.md`." "$RUN_URL")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
