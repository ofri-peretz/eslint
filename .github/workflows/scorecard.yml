# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OSSF Scorecard

# ─────────────────────────────────────────────────────────────────────────────
# OpenSSF Scorecard — measures the supply-chain security posture of this repo
# (branch protection, signed releases, dangerous workflow patterns, pinned
# dependencies, etc.) and uploads the SARIF result to GitHub's Code Scanning
# tab. Also publishes results to the public Scorecard API so the badge in
# README stays live.
#
# Quotas: weekly + on push to main only. The branch_protection check needs a
# token with admin:read permission, which is why repo_token references
# SCORECARD_REPO_TOKEN if available (PAT in repo secrets); otherwise it falls
# back to the default GITHUB_TOKEN which can run all checks except branch
# protection scoring.
#
# Get the badge: after the first run lands, copy the markdown from
# https://api.securityscorecards.dev/projects/github.com/ofri-peretz/eslint
# into README.md.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  schedule:
    # Weekly Tuesday 04:23 UTC — staggered off codeql + cron-storm hours.
    - cron: "23 4 * * 2"
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # to upload SARIF
      id-token: write          # to publish to securityscorecards.dev
      contents: read
      actions: read
      issues: write            # to open the failure issue (see the last step)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing to the public API enables the badge + history view.
          # Toggle to false here if you ever need to keep results private.
          publish_results: true
          repo_token: ${{ secrets.SCORECARD_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif

      # This workflow had no failure channel at all: it runs on `schedule` and
      # on push to main, and neither is anybody's screen. A red run showed up
      # only in the Actions tab, which is the definition of a check that has
      # stopped checking. Documented as a gap in docs/ci/SKIP_PATHS.md.
      #
      # No `github.event_name == 'schedule'` filter, unlike the crons that
      # already report: a push-to-main failure here is just as unwatched as a
      # scheduled one. The action dedupes by title — one issue, commented on —
      # so a persistent failure cannot turn into weekly noise.
      - name: 🚨 Report a failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: 'OSSF Scorecard is failing'
          body: 'The OpenSSF Scorecard run failed, so the supply-chain posture score and the README badge are no longer being refreshed.'
          token: ${{ github.token }}
