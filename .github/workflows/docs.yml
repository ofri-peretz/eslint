# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docs Governance

# ─────────────────────────────────────────────────────────────────────────────
# Validates that documentation stays in sync with code:
#   - validate-docs.ts: structural checks (README sections, LICENSE, etc.)
#   - sync-readme-rules.ts --dry-run: rule tables in READMEs match src/index.ts
#
# Replaces the old lint-pr.yml + lint-docs.yml duo, which both ran
# validate-docs.ts on overlapping triggers (any PR that touched both code and
# docs ran the same script twice). One workflow, two complementary triggers.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    # Run on any PR — `paths-ignore` is intentionally absent. validate-docs is
    # cheap (~15s) and code changes can break docs/rule alignment, so we want
    # it to gate every PR.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      - name: Validate documentation structure
        run: npx tsx scripts/validate-docs.ts

      - name: Check rule tables sync (dry run)
        run: npx tsx scripts/sync-readme-rules.ts --dry-run

      # Catches markdown tables that parse as paragraphs and ship as literal
      # pipe text (require-tool-confirmation#options, 2026-08). Uses the same
      # remark-gfm pipeline the site renders through, so a pass here means the
      # docs site emits a real <table>.
      - name: Check doc tables render as tables (regression lock)
        run: npx tsx scripts/validate-doc-tables.ts

      - name: Check README + homepage UTM links (regression lock)
        run: npx tsx scripts/check-utm-links.ts
