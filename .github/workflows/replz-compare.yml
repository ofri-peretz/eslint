# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Differential (replz compare)

# Every plugin's rules over benchmarks/corpus through the PR's base and its head
# (.sdlc/replz/compare.yaml): any finding that appears, disappears or moves fails the run, unless
# `approved` there names that exact change with a reason. The recall gate in quality.yml asks
# whether each CWE still detects; this catches everything else a rule change does to the corpus.
#
# The base is a git worktree with its own `npm ci` (the config's `setup`), so neither tree borrows
# the other's node_modules. Both read the one ~/.npm cache the setup action restores.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/eslint-plugin-*/src/**"
      - "packages/eslint-devkit/src/**"
      - "benchmarks/corpus/**"
      - "eslint.benchmark.config.mjs"
      - "package-lock.json"
      - ".sdlc/replz/**"
      - ".github/workflows/replz-compare.yml"

concurrency:
  group: replz-compare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    name: replz compare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the base commit is checked out as a worktree beside this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Compare base and head
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The checkout is the PR merged into the base's tip, so the base's tip is the right other
        # side: whatever differs between them is this PR's change.
        run: |
          set -o pipefail
          npx --yes replz@1.1.0 compare --base "$BASE_SHA" 2>&1 | tee "$RUNNER_TEMP/compare.log"

      - name: Summary
        if: always()
        run: |
          { echo '## replz compare'; echo; echo '```'; cat "$RUNNER_TEMP/compare.log" || echo '(no output)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
