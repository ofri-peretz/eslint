# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Changesets

run-name: >-
  Changesets · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || (github.event_name == 'push' && 'open / refresh Version PR' || 'manual') }}

# ─────────────────────────────────────────────────────────────────────────────
# Two responsibilities:
#
# 1. On PR — soft "is there a changeset?" advisory. Posts a one-time PR
#    comment if a PR touches `packages/*/src` or `package.json` but has no
#    `.changeset/*.md` file. Skipped (passes silently) when the PR carries
#    the `skip-changeset` label.
#
# 2. On push to main — opens / refreshes the "Version Packages" PR. It
#    accumulates every changeset since the last release, bumps each
#    affected `package.json`, regenerates CHANGELOG.md, and deletes the
#    consumed changeset files. Merging that PR triggers release.yml.
#
# We do NOT pass `publish:` to changesets/action — version-only mode keeps
# publishing in release.yml where we already have matrix-parallel fan-out.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Open / refresh Version Packages PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit version bumps + CHANGELOGs
      pull-requests: write # open / update the Version PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # THIS is the credential the Version PR's push actually uses.
          #
          # `actions/checkout` persists a git credential, and every later `git
          # push` in the job uses it — regardless of what token the changesets
          # action is handed in `env`. Setting only the env var (the previous
          # change) was necessary and not sufficient: the push still went out as
          # `GITHUB_TOKEN`, GitHub suppressed the workflow triggers it would
          # otherwise fire, and the Version PR kept opening with ZERO checks.
          # Measured: PR #600 sat at 0 checks through a full changesets run with
          # the env var already set.
          #
          # `docs-data.yml` has had this right all along and its comment
          # describes the same failure; the release workflow simply never got
          # the same treatment. That workflow's PR (#578) is authored by
          # `ofri-peretz` and carries 28 checks, which is the proof that the
          # token in this chain has write access to this repository.
          #
          # `github.token` stays last, so this cannot be worse than today.
          token: ${{ secrets.RELEASE_BOT_PAT || secrets.AGENTS_REPO_PAT || github.token }}
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      # `changesets/action` opens the Version PR unconditionally. With nothing
      # pending, `changeset version` produces no diff, the action pushes an
      # identical `changeset-release/main`, and GitHub rejects the PR:
      #
      #   Validation Failed: No commits between main and changeset-release/main
      #
      # The job then fails on EVERY push to main for as long as the changeset
      # queue is empty — which is the normal state right after a release. Two
      # of today's four failures were this, including one on the previous
      # release merge (#538) before any related change, so it is the steady
      # state and not a regression.
      #
      # Nothing is wrong when this happens: there is simply nothing to release.
      # A job that goes red for the expected case trains you to ignore it, and
      # this one shares a name with the gate that actually matters.
      # Counting `.changeset/*.md` is NOT the test, which is the subtlety that
      # makes this worth a step of its own. A changeset naming only private
      # packages is ignored by changesets and bumps nothing — `.changeset/` is
      # non-empty, the release plan is empty, and the action still tries to
      # open the PR. That is the live state right now:
      # `fix-plugin-stats-rule-count.md` names `docs`, which is `private: true`,
      # so `changeset status` reports 0 releases from 1 changeset.
      #
      # The release plan is the only thing that predicts whether `version`
      # produces a diff, so gate on that. `--output` writes the plan as JSON;
      # `releases` is what would actually be bumped.
      - name: Will the Version PR have anything in it?
        id: pending
        run: |
          set -euo pipefail
          npx changeset status --output=/tmp/release-plan.json > /dev/null
          releases=$(node -p "require('/tmp/release-plan.json').releases.length")
          changesets=$(node -p "require('/tmp/release-plan.json').changesets.length")
          echo "releases=${releases}" >> "$GITHUB_OUTPUT"
          # Both counts are exported: `releases` decides whether the action
          # runs, `changesets` is what separates "queue is empty" from "queue
          # holds only changesets that bump nothing". Exporting just the first
          # collapses the two and makes the summary below claim a distinction
          # it cannot see.
          echo "changesets=${changesets}" >> "$GITHUB_OUTPUT"
          if [ "$releases" -eq 0 ] && [ "$changesets" -gt 0 ]; then
            echo "::notice::${changesets} changeset(s) present but 0 package(s) to release — they name only private packages, so nothing can be versioned."
          elif [ "$releases" -eq 0 ]; then
            echo "No changesets pending — nothing to open a Version PR for."
          else
            echo "${releases} package(s) to release from ${changesets} changeset(s)."
          fi

      - name: Open / refresh Version PR
        id: changesets
        if: steps.pending.outputs.releases != '0'
        # PINNED TO v1 ON PURPOSE, and the SHA is the thing that matters.
        #
        # changesets/action v2 requires Changesets CLI v3 and refuses to run
        # against v2 — "This version of the Changesets action is designed to work
        # with Changesets CLI v3". This repo is on @changesets/cli ^2.31.1.
        #
        # #579 bumped this SHA across that major as part of a 10-action group
        # update and left the `# v1` comment untouched, so the pin READ as v1
        # while resolving to v2.1.1. The Version PR then stopped being created —
        # silently, because a missing PR looks identical to "nothing to release".
        # Two customer-facing false-positive fixes sat unpublishable behind it.
        #
        # Moving to v2 means upgrading the CLI to v3 first. Until then this stays
        # on v1.9.0, and the comment states the constraint so the next bump has to
        # confront it rather than sail past it.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # `version` runs `npm run changeset:version`, which bumps versions
          # AND regenerates the lockfile so the PR diff is complete.
          version: npm run changeset:version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          # No `publish:` — release.yml does that on merge.
        env:
          # The SAME token chain the approve step below uses, and for a sharper
          # reason: this is the push that decides whether the Version PR ever
          # runs a check at all.
          #
          # GitHub deliberately suppresses workflow triggers for anything done
          # with `GITHUB_TOKEN`, to stop a workflow opening a PR that triggers a
          # workflow that opens a PR. The side effect here is total: the Version
          # PR opened with ZERO checks, so the required checks could never go
          # green, so it could never merge, so nothing was ever published.
          # Measured 2026-08-23 on PR #600 — 0 checks, not failing, never run.
          #
          # A PAT is a person rather than the bot, so its pushes trigger CI
          # normally. The `||` chain keeps `GITHUB_TOKEN` last, so behaviour is
          # unchanged until a PAT exists — this line cannot make things worse,
          # and it means setting the secret is the only remaining step.
          #
          # Until then the manual remedy is to close and reopen the Version PR,
          # which re-triggers its workflows. Note that EVERY later merge to main
          # force-pushes this branch again and resets the checks to zero, so the
          # close/reopen has to be the last action before merging.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_PAT || secrets.AGENTS_REPO_PAT || secrets.GITHUB_TOKEN }}
          # changesets/action runs `git commit` + `git push origin
          # HEAD:changeset-release/main` to open the Version PR. CI installs
          # lefthook git hooks (npm ci → prepare), and the pre-push `changelog`
          # gate then fails the bot's push — the version-bump commit has package
          # changes but the changesets were just consumed by `changeset version`
          # (and `shim-verify` flags dist it can't see). Disable lefthook for this
          # automated push; the real gates run on the resulting Version PR.
          LEFTHOOK: '0'

      # Closes the loop for solo-maintainer continuous delivery: once CI is
      # green, GitHub auto-squash-merges the Version PR. release.yml then fires
      # on the resulting push to main and ships to npm.
      #
      # If branch protection requires a CODEOWNERS review:
      #   - Set `RELEASE_BOT_PAT` (a fine-grained PAT with `pull_request: write`
      #     on this repo) to have the bot self-approve. `AGENTS_REPO_PAT` is
      #     accepted as a fallback so an existing token can be reused rather
      #     than minting a second one for the same job — if it happens to lack
      #     `pull_request: write` here, the approve step warns and auto-merge is
      #     still set, which is exactly the behaviour without any PAT at all.
      #     So the fallback can never be worse than the status quo.
      #   - Without the PAT: auto-merge waits until you click "Approve" once.
      #     Auto-merge persists across CI re-runs, so the merge still happens
      #     unattended after that single approval.
      - name: Enable auto-merge on the Version PR
        if: steps.changesets.outputs.hasChangesets == 'true' && steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT || secrets.AGENTS_REPO_PAT || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.changesets.outputs.pullRequestNumber }}
          HAS_PAT: ${{ secrets.RELEASE_BOT_PAT != '' || secrets.AGENTS_REPO_PAT != '' }}
        run: |
          set -euo pipefail
          # Self-approve when a PAT is configured (bypasses CODEOWNERS gate).
          if [ "$HAS_PAT" = "true" ]; then
            gh pr review "$PR" --approve --body "Auto-approved by changesets bot — review via the changesets that produced this PR." || \
              echo "::warning::Auto-approve failed (PAT may lack permission). Auto-merge still set."
          fi
          # Idempotent: re-running the workflow re-asserts auto-merge.
          gh pr merge "$PR" --auto --squash || \
            echo "::warning::gh pr merge --auto returned non-zero. Repo may have auto-merge disabled in Settings → General."

      # ───────────────────────────────────────────────────────────────────
      # Preview the cross-package rollup on the Version PR itself.
      #
      # The Version PR's own diff is ~20 package.json version bumps and ~20
      # CHANGELOG hunks — accurate, and unreadable as a description of what is
      # about to ship. This posts the same grouped rollup that will become the
      # release's GitHub Release, so the release notes are reviewed *before*
      # the merge that publishes them rather than discovered after.
      #
      # Runs against the pushed `changeset-release/main` branch, not the
      # runner's tree: changesets/action commits and pushes the bumps, and the
      # comparison base is main.
      # ───────────────────────────────────────────────────────────────────
      - name: Preview rollup notes on the Version PR
        if: steps.changesets.outputs.hasChangesets == 'true' && steps.changesets.outputs.pullRequestNumber
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail
          # Fetched separately, and checked out by its remote-tracking ref: a
          # multi-ref `git fetch` writes every ref into FETCH_HEAD and the
          # bare name resolves to the *first* one, which would silently give
          # us main and a diff of nothing.
          git fetch origin main
          git fetch origin changeset-release/main
          git checkout --detach origin/changeset-release/main

          {
            echo "<!-- release-rollup-preview -->"
            echo "## 📦 Release preview"
            echo ""
            echo "What merging this PR will publish, grouped by kind. These are the notes that become the rollup GitHub Release."
            echo ""
            npx tsx scripts/release-notes.ts --since=origin/main
          } > rollup-preview.md

          # Upsert by marker so re-runs edit one comment instead of stacking.
          # `gh api` (not `gh pr view --json comments`) because only the REST
          # listing carries the numeric comment id that PATCH needs.
          existing=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq '.[] | select(.body | contains("<!-- release-rollup-preview -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${existing}" \
              -F body=@rollup-preview.md >/dev/null
            echo "↻ Updated rollup preview comment"
          else
            gh pr comment "$PR" --body-file rollup-preview.md
            echo "🆕 Posted rollup preview comment"
          fi

      - name: Summarize
        if: always()
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          RELEASES: ${{ steps.pending.outputs.releases }}
          CHANGESETS: ${{ steps.pending.outputs.changesets }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "# Changesets · push to main"
            echo ""
            if [ "$HAS_CHANGESETS" = "true" ]; then
              if [ -n "${PR_NUMBER:-}" ] && [ "$PR_NUMBER" != "null" ]; then
                echo "📦 Version PR ready: [#${PR_NUMBER}](https://github.com/${REPO}/pull/${PR_NUMBER})"
                echo ""
                echo "Merging that PR triggers \`release.yml\` to publish the bumped packages."
              else
                echo "📦 Changesets detected but Version PR not opened (likely first run after CI was set up). Re-running may help; otherwise check the action logs."
              fi
            elif [ "${RELEASES:-0}" = "0" ] && [ "${CHANGESETS:-0}" != "0" ]; then
              # Both counts are needed to tell these apart. `releases == 0`
              # alone is also true for an empty queue — the normal state right
              # after a release — so branching on it would print this message
              # almost every run and bury the case it is meant to flag.
              echo "✅ Nothing to release — the ${CHANGESETS} pending changeset(s) name only private packages."
              echo ""
              echo "Changesets ignores \`private: true\` packages, so these bump nothing"
              echo "and will sit in \`.changeset/\` indefinitely. Remove them, or point"
              echo "them at a published package."
            else
              echo "✅ No pending changesets — nothing queued for release."
              echo ""
              echo "Add one with \`npm run changeset\` in your next user-visible PR."
            fi
            echo ""
            echo "_Tip: \`npm run release:status\` shows the same view locally._"
          } >> "$GITHUB_STEP_SUMMARY"

  required:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write # post the advisory comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      # The rule lives in scripts/check-changeset-coverage.ts, not inline here:
      # it was duplicated (badly) between this job and the pre-push hook, and
      # the two disagreed about whether the same branch was releasable. See
      # that script's header for why raw `changeset status` is the wrong
      # question.
      - name: Check for changeset
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if echo ",$LABELS," | grep -q ',skip-changeset,'; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "Label 'skip-changeset' present — passing."
            exit 0
          fi

          npx tsx scripts/check-changeset-coverage.ts --since="$BASE_SHA" --json > coverage.json
          npx tsx scripts/check-changeset-coverage.ts --since="$BASE_SHA"

          status=$(jq -r '.status' coverage.json)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "missing" ]; then
            echo "::warning::PR changes consumer-visible source but has no changeset."
          fi
          # `partial` did not exist until 2026-08-30. Before it, one changeset
          # naming one package vouched for a diff that changed twenty, and this
          # job reported green — 18 plugins nearly shipped with no version bump
          # and no changelog entry.
          if [ "$status" = "partial" ]; then
            echo "::warning::$(jq -r '.uncovered | length' coverage.json) changed package(s) are named by no changeset: $(jq -r '.uncovered | join(", ")' coverage.json)"
          fi

      # Stage 1 of AI_SDLC.md. Advisory like the coverage check above, and for
      # the same reason: intent is a judgement the author makes, and it must
      # never be the thing that stops a branch. `drift` is the interesting
      # signal — work that spread past the radius it declared.
      - name: Check intent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if echo ",$LABELS," | grep -q ',skip-intent,'; then
            echo "Label 'skip-intent' present — passing."
            exit 0
          fi
          npx tsx scripts/check-intent.ts --since="$BASE_SHA" --json > intent.json
          npx tsx scripts/check-intent.ts --since="$BASE_SHA"
          drift=$(jq -r '[.problems[]? | select(.kind == "drift")] | length' intent.json)
          if [ "$drift" != "0" ]; then
            echo "::warning::$drift package(s) changed that no intent file declared."
          fi

      # Unlike the coverage advisory above, this one blocks. A breaking change
      # published without an upgrade path cannot be taken back — npm has no
      # unpublish after 72h, and the changeset text is the whole of what a
      # consumer gets. See scripts/lint-changesets.ts.
      - name: Lint changeset quality
        run: npm run changeset:lint

      # Presence is not validity. The check above greps for a `.changeset/*.md`
      # file and stops there, so a changeset that `changeset version` refuses
      # passed this job green and failed on `main` after merge — where it
      # blocks the release PR and every publish behind it.
      #
      # That happened on #549: a changeset listing `eslint-plugin-express-security`
      # (published) alongside `@interlace/ui` (`private: true`, so changesets
      # treats it as ignored). Mixing ignored and non-ignored packages in one
      # changeset is rejected, and nothing said so until it was already merged.
      #
      # `changeset status` builds the same release plan `version` does and exits
      # 1 on exactly this class. Verified both directions before wiring it up:
      # exit 1 on the mixed changeset, exit 0 once split.
      - name: Changeset is versionable
        if: steps.check.outputs.status == 'present'
        run: |
          set -euo pipefail
          # `changeset status` resolves `baseBranch` ("main") as a LOCAL ref and
          # dies with "Failed to find where HEAD diverged from main" without one.
          # `fetch-depth: 0` fetches every commit but still checks out only the
          # PR branch, so `main` exists as `origin/main` and nothing else.
          #
          # This step shipped green because it is conditional: a PR with no
          # changeset skips it entirely, and every PR merged between it landing
          # and this one happened to be in that class. The first PR that
          # actually carried a changeset — this one — was also the first to run
          # it, and it failed on the missing ref rather than on anything about
          # the changeset.
          git branch --force main origin/main
          npx changeset status

      - name: Summarize
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          set -euo pipefail
          case "$STATUS" in
            present)
              header="✅ Changeset present"
              body="This PR ships at least one \`.changeset/*.md\` file — version bump + CHANGELOG entry will be derived from it."
              ;;
            not-needed)
              header="✅ No changeset needed"
              body="This PR doesn't touch \`packages/*/src/**\` or any \`package.json\` — release flow is unaffected."
              ;;
            missing)
              header="⚠️ Missing changeset"
              body="This PR touches package source but has no changeset. Run \`npm run changeset\` and commit the result, or add the \`skip-changeset\` label for internal-only work. A reminder comment was posted on the PR."
              ;;
            skipped)
              header="⏭ Skipped (label opt-out)"
              body="Label \`skip-changeset\` is present — this PR will not produce a release entry."
              ;;
            *)
              header="❓ Unknown"
              body="Status: \`$STATUS\`."
              ;;
          esac
          {
            echo "# $header"
            echo ""
            echo "$body"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR (when missing)
        if: steps.check.outputs.status == 'missing'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const marker = '<!-- changeset-reminder -->';
            const body = `${marker}
            ### 📝 Changeset reminder

            This PR touches \`packages/*/src/**\` or a \`package.json\`, but doesn't
            include a changeset. If this change is user-visible, please run:

            \`\`\`bash
            npm run changeset
            \`\`\`

            …and commit the resulting \`.changeset/*.md\` file. The version bump,
            the CHANGELOG entry, and this release's rollup notes are all derived
            from it — nothing is read from commit messages.

            Start the summary with a conventional-commit prefix
            (\`feat:\` / \`fix:\` / \`perf:\` / \`security:\` / \`docs:\`); it becomes the
            entry's kind badge and groups the cross-package rollup. Add \`!\`
            (\`feat(x)!:\`) or a \`BREAKING CHANGE:\` body line for anything that
            breaks consumers. See [.changeset/README.md](https://github.com/${{ github.repository }}/blob/main/.changeset/README.md).

            If the change is internal-only (refactor, tests, build tooling),
            add the \`skip-changeset\` label to silence this check.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
