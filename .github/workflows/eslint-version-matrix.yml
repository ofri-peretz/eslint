name: ILB Cross-Version Matrix

# Runs the cheap synthetic benches (ILB-Arena + ILB-CWE-Corpus) across a
# matrix of Node and ESLint major versions to catch silent FN drift
# from upstream AST changes before users hit it.
#
# Supported ESLint majors are governed by docs/ESLINT_VERSION_SUPPORT.md:
#   - v8 (24% weekly share — gate)
#   - v9 (60% — gate, current default)
#   - v10 (9% — forward-looking exception, released 2026-02-06)
# This matrix MUST cover all three. When the policy changes, update both
# this matrix and the policy doc together.
#
# Why per-major matters (Gap J in the FP_FN_REMEDIATION_TRACKER):
#   - AST shape changes between majors can silently make rules MISS findings
#     (= FN regression with passing tests on the old version). Recall is
#     principle #1 — we cannot allow it to drift on a version bump.
#   - We don't run Wild here — the matrix is hot-path only.
#
# Failure mode: this workflow runs continuously and is INFORMATIONAL by
# default. Promote a row to required status only after it's been green for
# 14 consecutive runs (per the lifecycle gate in benchmarks/README.md §1).

# ─────────────────────────────────────────────────────────────────────────────
# NOT run on pull requests — deliberately.
#
# This workflow costs 9 of the account's 20 concurrent GitHub-hosted job
# slots. Measured 2026-08-04: one PR fanned out to 37 jobs across 11 workflows,
# oversubscribing the budget 1.9x on its own, and 82% of all CI job-time was
# spent queueing for a runner rather than computing.
#
# This is drift detection, not per-change correctness, and it already has a
# weekly Sat cron backstop — so the PR trigger bought a slower queue for every
# contributor in exchange for signal the cron delivers anyway. Run it on demand
# with `workflow_dispatch` when a change plausibly affects it.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # Downgraded from nightly to weekly — quota conservation. Drift still
    # surfaces in time for the weekly engineering review, and any promoted
    # PR runs the full matrix via the `run-full-ci` label gate. Moved to
    # Saturday to stagger off the Sunday-morning weekly-cron burst.
    # Sat 09:30 UTC — inside the 3-7am ET maintenance window year-round.
    # GitHub cron is UTC and does not observe DST, so the slot must be valid at
    # BOTH offsets: 08:00-11:00 UTC maps to 4-7am EDT and 3-6am EST. Anything
    # earlier (07:00 UTC) drifts to 2am EST; anything later (12:00 UTC) drifts
    # to 8am EDT and lands in working hours.
    # Also moved off the 04:00-05:00 UTC cluster where several other crons
    # already stack and compete for the 20 concurrent job slots.
    - cron: '30 9 * * 6' # Sat 09:30 UTC = 5:30am EDT / 4:30am EST
  workflow_dispatch:

concurrency:
  group: ilb-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.bench }} · node24 · eslint-${{ matrix.eslint }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open the failure issue (.github/actions/report-failure)
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      # Cancel sibling cells on first failure when running the cross-version
      # matrix — when an ESLint major bumps and breaks one cell, every other
      # cell will almost always break the same way. Saves runner minutes per
      # regression. Override via workflow_dispatch if you need full results.
      fail-fast: true
      matrix:
        # Node axis is fixed to 24 (the repo's `engines.node` and `.nvmrc`).
        # All three ESLint majors are supported per docs/ESLINT_VERSION_SUPPORT.md:
        #   8.x = legacy active (24% share), 9.x = current default (60%),
        #   10.x = forward-looking (9%, released 2026-02-06).
        eslint: ['8.x', '9.x', '10.x']
        bench: [arena, juliet]
        experimental: [false]
        include:
          # Pinned-version sanity check on the most-used minor — catches
          # regressions specific to that pin without exploding the matrix.
          - eslint: '9.39'
            bench: arena
            experimental: false
          - eslint: '9.39'
            bench: juliet
            experimental: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The arena resolves every plugin by package name, which goes through
      # `exports` to dist/ — so without this the run dies on the first config
      # with `Cannot find module '.../eslint-plugin-secure-coding/dist/src/index.js'`
      # and exits 3. That is what it has done on every scheduled run since
      # 2026-08-29.
      #
      # Before the ESLint swap below, not after: the swap installs eslint 8, 9
      # or 10 with --no-save, and the plugin build should be the one this repo
      # normally produces rather than whatever that swap leaves behind. The
      # build is tsc/tsup and does not read ESLint at build time, so it is
      # identical across the matrix — which also lets turbo cache it once.
      #
      # Same filter quality-full.yml uses, for the same reason.
      - name: Build plugins (dist/ is what the configs load)
        run: npx turbo run build --filter='eslint-plugin-*' --filter=@interlace/eslint-devkit

      - name: Install ESLint ${{ matrix.eslint }}
        run: |
          set -e
          case "${{ matrix.eslint }}" in
            "8.x")
              npm install --no-save eslint@^8
              ;;
            "9.39")
              npm install --no-save eslint@9.39.0
              ;;
            "9.x")
              npm install --no-save eslint@^9
              ;;
            "10.x")
              npm install --no-save eslint@^10
              ;;
            *)
              echo "::error::Unknown ESLint version selector: ${{ matrix.eslint }}"
              exit 1
              ;;
          esac
          node -e "console.log('eslint@' + require('eslint/package.json').version)"

      - name: Run ILB-Arena
        if: matrix.bench == 'arena'
        run: npm run ilb:arena

      - name: Run ILB-CWE-Corpus
        if: matrix.bench == 'juliet'
        run: npm run ilb:cwe-corpus

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ilb-${{ matrix.bench }}-node24-eslint${{ matrix.eslint }}-${{ github.run_number }}
          path: benchmarks/results/ilb-${{ matrix.bench }}/*.json
          retention-days: 14

      # A red cron notifies nobody by default. See .github/actions/report-failure.
      - name: 🚨 Report a scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/report-failure
        with:
          title: 'ESLint version matrix is failing'
          body: 'The scheduled ESLint version matrix failed. Support for one of the declared ESLint majors may be broken, or the matrix itself is.'
          token: ${{ github.token }}

  # Aggregate failure reporting.
  #
  # Reporting from inside the working jobs does not survive the shapes those
  # jobs actually fail in: a `fail-fast` matrix cancels its siblings (and
  # `failure()` is false in a cancelled job), and a report living in one job
  # says nothing when a different job is the one that breaks. This job depends
  # on all of them and runs with `if: always()`, so it sees the whole run.
  report:
    name: 🚨 Report a scheduled failure
    needs: [matrix]
    if: >-
      always() && github.event_name == 'schedule' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: "ESLint version matrix is failing"
          body: >-
            At least one ESLint major stopped passing. This matrix is the only check that the plugins work across ESLint 8, 9 and 10, so a break here is a compatibility claim we can no longer make.
          token: ${{ github.token }}
