# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Model Fidelity

# Every rule in the modelled plugins has a Quint model of what it SHOULD
# decide (benchmarks/suites/fidelity/). This samples each model and lints every
# sampled input with the built rule; one disagreement fails the run, and so does
# a rule with no model. See benchmarks/suites/fidelity/AUTHORING.md.
#
# Until this workflow nothing ran it, so a rule could drift from its model and
# only a manual `npm run fidelity` would notice. A full local run is ~33 min,
# so it is a matrix, one job per plugin, and PRs run only the plugins they touch.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Not just src/: package.json and tsconfig shape the built dist/ too.
      - 'packages/eslint-plugin-*/**'
      - 'packages/eslint-devkit/**'
      - 'benchmarks/suites/fidelity/**'
      - '.github/workflows/fidelity.yml'
  schedule:
    - cron: '41 4 * * 0' # 04:41 UTC Sunday
  workflow_dispatch:

concurrency:
  group: fidelity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Pick plugins
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugins: ${{ steps.pick.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # From run.cjs's PLUGINS, not models/: a plugin whose models were all
          # deleted must still get a job, and fail as unmodelled.
          all=$(node -e "const s=require('fs').readFileSync('benchmarks/suites/fidelity/run.cjs','utf8');console.log(s.match(/const PLUGINS = \[([^\]]*)\]/)[1].match(/'[^']+'/g).map((x)=>x.slice(1,-1)).join(' '))")
          # A devkit, runner, shared suite helper or workflow change can move
          # any rule: run them all.
          if [ "$EVENT" != pull_request ] ||
             git diff --name-only "origin/$BASE_REF"...HEAD |
               grep -qE '^(packages/eslint-devkit/|benchmarks/suites/fidelity/[^/]+\.cjs$|\.github/workflows/fidelity\.yml)'; then
            picked=$all
          else
            changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
            picked=$(for p in $all; do
              echo "$changed" | grep -qE "^(packages/eslint-plugin-$p/|benchmarks/suites/fidelity/models/$p/)" && echo "$p"
            done; true)
          fi
          echo "plugins=$(printf '%s\n' $picked | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  fidelity:
    name: Fidelity (${{ matrix.plugin }})
    needs: plan
    if: needs.plan.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plan.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          deps: lean

      # Quint fetches its Rust evaluator from the GitHub API on first use,
      # unauthenticated, and parallel matrix jobs hit the 60/hour rate limit
      # ("Release v0.7.1 not found: rate limit exceeded", #1388). Fetch it here
      # with the job token; Quint finds it in ~/.quint and skips the download.
      # ponytail: pinned to the evaluator quint@0.33.1 (run.cjs) ships with. On a
      # Quint bump, update it; a stale pin only brings the flaky download back.
      - name: Fetch the Quint evaluator
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATOR: v0.7.1
        run: |
          dir="$HOME/.quint/rust-evaluator-$EVALUATOR"
          mkdir -p "$dir"
          gh release download "evaluator/$EVALUATOR" -R quint-co/quint \
            -p 'quint_evaluator-x86_64-unknown-linux-gnu.tar.gz' -O - | tar -xz -C "$dir"
          test -x "$dir/quint_evaluator"

      - run: npx turbo run build --filter="eslint-plugin-$PLUGIN"
        env:
          PLUGIN: ${{ matrix.plugin }}

      - run: npm run fidelity -- "$PLUGIN"
        env:
          PLUGIN: ${{ matrix.plugin }}

  # A red cron notifies nobody by default. See .github/actions/report-failure.
  report:
    name: Report a scheduled failure
    needs: [plan, fidelity]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Required to open / update the tracking issue.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🚨 Report a scheduled failure
        uses: ./.github/actions/report-failure
        with:
          title: 'Weekly model fidelity is failing'
          body: 'A rule disagreed with its Quint model on a sampled input, a model stopped covering its domain, or a rule has no model. The failing job log prints the input and both verdicts.'
          token: ${{ github.token }}
