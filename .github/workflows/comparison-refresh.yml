name: Comparison artifact refresh

# The five artifacts that state where we stand — against the ecosystem, against
# the CWE catalogue, against ISO 25010 — and had nothing that regenerated them.
#
# Each carried a TTL in `scripts/check-audit-freshness.ts` and each was 112 days
# old. The reason was not a missing schedule: the refresh command the gate
# advertised did not EXIST. `npm run ilb:leaderboard-publish` had no npm script
# behind it, and neither did three of its neighbours — the underlying
# `scripts/ilb-*.ts` were there all along, unreachable by the name the gate told
# you to type. Running them once took all five from 112 days to zero.
#
# Monthly, not weekly. The shortest TTL here is 30 days and Actions minutes are
# finite; a monthly run beats every TTL with margin. See
# `intent/2026-08-30-the-comparison-refreshes-itself.md`.

on:
  schedule:
    # 1st of the month, 07:00 UTC — an hour after resource-profile so the two
    # monthly jobs do not contend for a runner.
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Regenerate and commit the comparison artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commit the refreshed artifacts
      issues: write # open the failure issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc

      - name: Install (no audit / fund — we only need tsx)
        run: npm ci --no-audit --no-fund

      # Each was executed locally before being scheduled. A scheduled job that
      # cannot run is a seventh permanently-red thing, which is the failure this
      # workflow exists to end rather than repeat.
      - name: Peer leaderboard
        run: npm run ilb:leaderboard-publish

      - name: CWE coverage report
        run: npm run docs:cwe-coverage

      - name: Federated wild-corpus aggregate
        run: npm run ilb:federated-aggregate

      - name: Compliance crosswalk
        run: npm run ilb:mappings-report

      - name: ISO 25010 crosswalk
        run: npm run ilb:iso25010-report

      - name: Commit whatever moved
        run: |
          if [ -n "$(git status --porcelain benchmark-results/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add benchmark-results/
            git commit -m "chore(benchmarks): refresh the comparison artifacts

            Monthly regeneration of the leaderboard, CWE coverage, federated
            wild-corpus aggregate and the two crosswalks. Before this workflow
            existed all five were 112 days old, because the refresh commands the
            freshness gate advertised had no npm script behind them."
            git push
          else
            echo "No comparison-artifact changes detected."
          fi

      # A refresher that fails notifies nobody by default, and this whole
      # workflow exists because five artifacts went stale with nothing saying so.
      - name: 🚨 Report a failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: 'Comparison artifact refresh is failing'
          body: >-
            The monthly regeneration of the leaderboard, CWE coverage, federated
            wild-corpus and crosswalk artifacts failed. Those are the numbers
            that state where we stand against the ecosystem; if this stays red
            they go stale again and check:audit-freshness will say so weeks
            later.
          token: ${{ github.token }}
