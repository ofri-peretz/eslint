# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lighthouse (Web Vitals Budget)

# ─────────────────────────────────────────────────────────────────────────────
# Tracks the performance, accessibility, and SEO budgets declared by our
# philosophies — MOTION_PHILOSOPHY.md (CLS = 0), UX_PHILOSOPHY.md #6 (LCP),
# COLOR_PHILOSOPHY.md (contrast budget), TYPOGRAPHY_PHILOSOPHY.md (AA floor).
#
# Not a PR check. It used to run advisory on every docs PR, which spent ~15
# minutes of runner time per PR to produce a result nobody could act on: a
# single-pass Lighthouse on a shared runner carries ~50–100ms of LCP jitter
# from cold CPU and network, so a breach was as likely to be noise as a
# regression — and `continue-on-error` meant it never blocked anything anyway.
#
# So it runs weekly against main, where it is a HARD GATE, and reports:
#   • the job summary always carries the scores table and any breach rows
#   • a breach opens (or updates) a single tracking issue labelled `perf`
#   • the HTML reports upload as an artifact either way
#
# workflow_dispatch is the escape hatch when you're chasing a perf claim on a
# branch and want the numbers now.
#
# Config: apps/docs/lighthouserc.json   Report: apps/docs/scripts/lighthouse-report.ts
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  schedule:
    - cron: '5 4 * * 3' # Wed 04:05 UTC — weekly, staggered off the Sunday burst

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # the weekly report files/updates its own tracking issue

jobs:
  lighthouse:
    name: Web Vitals Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'
          next-cache: 'true'

      - name: Build docs site
        run: npx turbo run build --filter=docs
        env:
          NODE_ENV: production
          # Disable telemetry during CI builds.
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Start docs server
        working-directory: apps/docs
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          PORT: '3000'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.0

      - name: Run Lighthouse CI
        id: lhci
        working-directory: apps/docs
        # Deliberately not continue-on-error: the reason this left the PR path
        # is so that a breach here means something. The report step below runs
        # on failure too, so a red run still explains itself.
        run: lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render report
        id: report
        if: always()
        working-directory: apps/docs
        run: |
          set -euo pipefail
          npx tsx scripts/lighthouse-report.ts \
            --dir .lighthouseci \
            --out "$RUNNER_TEMP/lighthouse-report.md" > /dev/null
          cat "$RUNNER_TEMP/lighthouse-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: File or update the tracking issue
        if: always() && steps.lhci.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: ${{ runner.temp }}/lighthouse-report.md
          TITLE: 'Web Vitals budget breached (weekly run)'
        run: |
          set -euo pipefail
          # The label may not exist yet; creating it here keeps the first
          # breach from failing on `--label perf` instead of reporting.
          gh label create perf --color FBCA04 \
            --description "Performance / Web Vitals budget" 2>/dev/null || true
          # One issue, reopened and re-bodied each week — a fresh issue every
          # Wednesday would bury the signal it exists to raise.
          existing=$(gh issue list --state all --label perf --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body-file "$REPORT_PATH"
            gh issue reopen "$existing" 2>/dev/null || true
            echo "::notice::Updated perf issue #$existing"
          else
            gh issue create --title "$TITLE" --label perf --body-file "$REPORT_PATH"
          fi

      - name: Close the tracking issue once budgets are met again
        if: steps.lhci.outcome == 'success' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Web Vitals budget breached (weekly run)'
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --label perf --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [[ -n "$open" ]]; then
            gh issue close "$open" --comment "Budgets met again as of $GITHUB_SHA — closing until the next breach."
          fi

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-report
          path: |
            apps/docs/.lighthouseci/
            ${{ runner.temp }}/lighthouse-report.md
          retention-days: 90

  # Without this the jobs above can fail on a schedule with nobody watching:
  # a red cron produces no PR, no reviewer and no notification, so silence and
  # success look identical. Tracked as debt in .github/cron-alerting-debt.json.
  report:
    name: "\U0001F6A8 Report a scheduled failure"
    needs: [lighthouse]
    if: >-
      always() && github.event_name == 'schedule' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: "Lighthouse audit is failing"
          body: >-
            The scheduled Lighthouse run did not complete, so regressions in docs-site performance and accessibility scores are going unmeasured.
          token: ${{ github.token }}
