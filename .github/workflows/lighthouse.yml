# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lighthouse (Web Vitals Budget)

# ─────────────────────────────────────────────────────────────────────────────
# Tracks the performance, accessibility, and SEO budgets declared by our
# philosophies — MOTION_PHILOSOPHY.md (CLS = 0), UX_PHILOSOPHY.md #6 (LCP),
# COLOR_PHILOSOPHY.md (contrast budget), TYPOGRAPHY_PHILOSOPHY.md (AA floor).
#
# Gating model (intentionally split):
#   • PR runs (pull_request)        → ADVISORY. The lhci step uses
#     `continue-on-error: true`. The report still uploads as an artifact
#     and renders in checks, but a budget breach doesn't block merge.
#     Rationale: single-pass Lighthouse on a shared GitHub runner has
#     ~50–100ms of LCP jitter from cold CPU / network — too noisy to use
#     as a PR-blocking gate. We were treating noise as failure.
#   • Schedule (weekly Wednesday)   → HARD GATE. Same job, same config,
#     but a budget breach exits non-zero and pages the perf owner. This
#     is the canonical "did we regress?" check.
#   • workflow_dispatch (manual)    → HARD GATE. Use for opt-in PR runs
#     when you're explicitly chasing a perf claim.
#
# Config: apps/docs/lighthouserc.json
# Triggers: ready_for_review / `run-full-ci` label / synchronize, plus the
# weekly Wednesday cron. See AGENTS.md "Promotion gate".
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    # See a11y.yml — `opened`/`reopened` are required for a PR created
    # directly as non-draft to trigger this at all.
    types: [opened, reopened, ready_for_review, labeled, synchronize]
    paths:
      - "apps/docs/**"
      - "packages/ui/**"
      - ".github/workflows/lighthouse.yml"
      - "apps/docs/lighthouserc.json"
      # `packages/eslint-devkit/**` used to be here and pulled this 9.9m job
      # onto every PR that touched the devkit — but apps/docs does not depend
      # on eslint-devkit at all (checked its manifest), so a devkit change
      # cannot move a single web-vital. packages/ui replaces it: that one does
      # ship into the docs bundle.
      #
      # Same reasoning, one level down. lighthouserc.json collects exactly four
      # URLs — /, /articles, /articles?tag=jwt, /articles?page=2 — so:
      #   • content/** is every docs + rule page, and not one of them is
      #     collected. A new rule page cannot move a measured vital.
      #   • src/data/** is generated rule-count JSON. It does render on /, but
      #     a change there is the text "458" becoming "459".
      # Both were pulling the full 9.9m job onto routine rule PRs. The
      # negations sit last because GitHub takes the LAST matching pattern:
      # lighthouserc.json and packages/ui never match them, so they stay
      # included, while a content/ or src/data/ path ends on a negation.
      - "!apps/docs/content/**"
      - "!apps/docs/src/data/**"
  workflow_dispatch:
  schedule:
    - cron: "5 4 * * 3" # Wed 04:05 UTC — weekly (staggered off the Sunday burst)

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # for the result comment

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$IS_DRAFT" == "false" ]] || [[ "$HAS_LABEL" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Draft PR without \`run-full-ci\` label — skipping Lighthouse."
          fi

  lighthouse:
    name: Web Vitals Budget
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          next-cache: "true"

      - name: Build docs site
        run: npx turbo run build --filter=docs
        env:
          NODE_ENV: production
          # Disable telemetry during CI builds.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start docs server
        working-directory: apps/docs
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          PORT: "3000"

      - name: Run Lighthouse CI
        id: lhci
        working-directory: apps/docs
        # Advisory on PRs (single-pass Lighthouse is too noisy to block on),
        # hard gate on the weekly cron + manual dispatch. The step always
        # produces the .lighthouseci/ artifact for the upload step below.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # `npx` over a global install: the version is still pinned, but it
        # resolves from the npm cache the setup action already hydrated
        # instead of a fresh ~30s registry fetch on every run.
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Annotate PR when budgets breach (advisory)
        if: github.event_name == 'pull_request' && steps.lhci.outcome == 'failure'
        run: |
          echo "::warning title=Lighthouse budget breached (advisory)::Lighthouse assertions failed but did not block this PR. Download the lighthouse-report artifact for full diagnostics, or re-run with the \`run-full-ci\` label / manual dispatch to enforce. The weekly Wednesday cron still enforces the budget on main."

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-report
          path: apps/docs/.lighthouseci/
          retention-days: 14
