# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Cache Invalidation Audit

# ─────────────────────────────────────────────────────────────────────────────
# Re-proves, on a schedule, that a cached task still re-runs when something it
# depends on changes.
#
# Why on a cadence rather than per-PR
# -----------------------------------
# The property this checks is global and slow-moving: it breaks when someone
# edits turbo.json, adds a workspace, or changes how vitest resolves workspace
# deps — not when a rule changes. Putting it on the PR path would spend a
# runner on every PR to re-answer a question that only changes when the build
# graph does. `scripts/__tests__/test-cache-sees-upstream-lock.test.ts` already
# guards the single devkit->dependent pair per-PR; this sweeps the rest.
#
# Why it must file an issue
# -------------------------
# A red cron notifies nobody. That is the whole subject of
# docs/ci/SKIP_PATHS.md, and an audit whose failures nobody sees would be the
# most ironic entry in it.
#
# Sampling: each run probes a rotating window (--sample takes the day of the
# month), so a week of runs covers the graph without any single run taking the
# minutes an exhaustive pass would.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every six hours at :20 — clear of the 04:00–05:30 cadence cluster and of
    # issue-sweep at :40, so the sweep reads a backlog this has finished writing.
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      width:
        description: "Dependents probed per upstream"
        required: false
        default: "3"
      task:
        description: "Turbo task to audit (test, build)"
        required: false
        default: "test"

concurrency:
  group: cache-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Re-prove cache invalidation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # the failure channel below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          # The audit reads task hashes; it must not have its own answers
          # pre-warmed by a restored cache.
          turbo-cache: "false"

      - name: Audit
        env:
          # Day of the month rotates the sample, so successive runs cover
          # different dependents rather than re-checking the same few forever.
          SAMPLE: ${{ github.event_name == 'schedule' && '0' || '1' }}
          WIDTH: ${{ inputs.width || '3' }}
          TASK: ${{ inputs.task || 'test' }}
        run: |
          set -euo pipefail
          if [ "$SAMPLE" = "0" ]; then SAMPLE=$(date -u +%-d); fi
          node --experimental-strip-types scripts/audit-cache-invalidation.ts \
            --task "$TASK" --sample "$SAMPLE" --width "$WIDTH"

      - name: 🚨 Report a stale-hash path
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "Cache invalidation audit found a stale-hash path"
          body: >-
            A cached task did not re-run when one of its inputs changed, so it
            can replay a previous PASS after the code under it moved. Until this
            is fixed, a green gate is not evidence those tests ran.
          token: ${{ github.token }}
