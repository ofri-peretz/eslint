# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docs Data Sync

# ─────────────────────────────────────────────────────────────────────────────
# Replaces the trio of stats-sync workflows (sync-docs-data.yml,
# update-coverage-stats.yml, update-docs-stats.yml) — all three wrote to
# apps/docs/src/data/, two of them duplicated each other's plugin-stats logic.
#
# All sync logic now lives in `apps/docs/scripts/*.mjs`. This workflow
# orchestrates them in one job, commits the result once, and exits.
#
# Triggers:
#   - push to main on packages/** → auto-sync after every plugin change.
#   - workflow_dispatch with `targets` input → run a subset on demand.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      targets:
        description: "Which sync steps to run (comma-separated). Empty = all."
        required: false
        default: ""

concurrency:
  # Don't run two syncs at once — they all write to the same JSON files.
  group: docs-data-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync apps/docs/src/data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the sync branch
      pull-requests: write   # open the rollup PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The push below has to use the same token the PR is opened with.
          # `actions/checkout` persists whatever it is given into the local git
          # config, defaulting to `github.token` — so setting GH_TOKEN for the
          # `gh` CLI alone is not enough: `git push` would still authenticate as
          # GITHUB_TOKEN, the resulting `synchronize` event would fire no
          # workflows, and the PR's checks would go stale on every run after the
          # first. `--auto` then has nothing to merge on. Needs `contents: write`
          # on whichever PAT resolves; without one this falls back to
          # `github.token` and behaves exactly as it does today.
          token: ${{ secrets.RELEASE_BOT_PAT || secrets.AGENTS_REPO_PAT || github.token }}
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      - name: Sync plugin stats
        if: inputs.targets == '' || contains(inputs.targets, 'plugin-stats')
        run: npx tsx apps/docs/scripts/sync-plugin-stats.ts

      - name: Sync README rule tables
        if: inputs.targets == '' || contains(inputs.targets, 'readme-rules')
        run: npx tsx apps/docs/scripts/sync-readme-rules.ts

      - name: Sync articles
        if: inputs.targets == '' || contains(inputs.targets, 'articles')
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
        run: npx tsx apps/docs/scripts/update-articles-data.ts

      - name: Sync coverage stats
        if: inputs.targets == '' || contains(inputs.targets, 'coverage')
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: npx tsx apps/docs/scripts/update-coverage-stats.ts

      # Open a PR rather than pushing to main.
      #
      # This step used to `git push` straight to main and failed on EVERY run
      # with `GH006: Protected branch update failed`. The sync itself always
      # succeeded ("9 succeeded, 0 errors") — only the push was rejected — so
      # the workflow reported red while doing its job correctly, and the data
      # it generated was thrown away.
      #
      # main requires up-to-date branches, resolved conversations and linear
      # history by deliberate policy, so the fix is to route the change through
      # review like any other. A bot token that bypasses protection would clear
      # the red X by punching a hole in the rule instead.
      #
      # Reuses one branch, so repeated runs update a single open PR rather than
      # opening one per push to main.
      #
      # Opened with a PAT where one is configured, and set to auto-merge,
      # because `github.token` made the PR unmergeable BY DESIGN: GitHub does
      # not fire `on: pull_request` workflows for a PR created with
      # GITHUB_TOKEN, so the required contexts never reported and the PR sat
      # `BLOCKED` with ZERO checks forever. That is the same failure the note
      # above describes, one step later — the sync succeeded, and its output was
      # discarded anyway. With no PAT set, every line here still works and the
      # old behaviour returns; nothing depends on the fallback being a PAT.
      #
      # This is NOT the bypass token the note rejects. Nothing about branch
      # protection changes: the PR still runs every required check and still has
      # to go green. The PAT only makes those checks RUN, and `--auto` merges the
      # PR once they pass so nobody has to babysit a diff of generated JSON.
      # `changesets-pr.yml` already uses exactly this pattern.
      - name: Open sync PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT || secrets.AGENTS_REPO_PAT || github.token }}
          BRANCH: automated/docs-data-sync
          # Passed through env rather than interpolated into the script body —
          # `${{ }}` inside `run:` is substituted before the shell sees it, so
          # keeping workflow context out of the command text is the habit worth
          # having even when the value (push | workflow_dispatch) is safe.
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if git diff --quiet apps/docs/src/data/; then
            echo "No changes to sync — nothing to open."
            exit 0
          fi

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Read the lease value explicitly instead of letting
          # `--force-with-lease` infer it.
          #
          # Bare `--force-with-lease` compares against the remote-tracking ref,
          # and rejects the push as "stale info" when it can't resolve one.
          # actions/checkout makes a SINGLE-BRANCH clone, so both the ref and
          # the fetch refspec that would map it are absent — and simply fetching
          # the branch does not help, because an unmapped refspec leaves the
          # lease unresolvable either way. The result was a workflow that
          # succeeded exactly once: the run that created $BRANCH pushed fine
          # (no remote branch, empty lease satisfied) and every run after it
          # failed on the push having done all the sync work correctly.
          #
          # An empty $LEASE is the documented "this ref must not exist yet"
          # form, so the create path keeps working. This is not `--force` in
          # disguise: a push that lands on $BRANCH after this read is still
          # refused, which is the whole point of the lease.
          LEASE=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)

          git checkout -B "$BRANCH"
          git add apps/docs/src/data/
          git commit -m "chore(docs): sync data [automated]"
          git push --force-with-lease="$BRANCH:$LEASE" origin "$BRANCH"

          # `--base main --limit 1` and `.[0].number // empty`: a bare
          # `--head "$BRANCH"` lookup does not filter by base and can return
          # several numbers, which would put a multi-line value into $PR and make
          # every later `gh pr` call nonsense.
          find_pr() {
            gh pr list --head "$BRANCH" --base main --state open --limit 1 \
              --json number --jq '.[0].number // empty'
          }

          PR=$(find_pr)
          if [ -n "$PR" ]; then
            echo "Existing PR #$PR updated with the new sync commit."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(docs): sync generated data" \
              --body "Regenerated apps/docs/src/data/ (trigger: $TRIGGER). Opened by the Docs Data Sync workflow; contents come entirely from the apps/docs/scripts/sync-* scripts, so review the diff rather than hand-editing."
            PR=$(find_pr)
          fi

          # Fail loudly rather than carrying an empty $PR into `gh pr merge`,
          # where it would be swallowed by the `|| echo` below and reported as a
          # successful sync that quietly enabled nothing.
          if [ -z "$PR" ]; then
            echo "::error::Pushed $BRANCH but could not resolve its PR number."
            exit 1
          fi

          # Idempotent: re-asserting auto-merge on every run is harmless, and it
          # re-arms the PR after a force-push resets its checks. Failure here is
          # not fatal -- the PR still exists and can be merged by hand.
          gh pr merge "$PR" --auto --squash || \
            echo "::warning::Could not enable auto-merge on #$PR; merge it manually."

