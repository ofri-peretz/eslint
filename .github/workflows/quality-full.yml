# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Quality (Full)

run-name: >-
  Quality (Full) · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || (github.event_name == 'schedule' && 'Weekly drift scan' || github.event_name) }}

# ─────────────────────────────────────────────────────────────────────────────
# Heavy half of the Quality Gate — Build, Tests, Typecheck, Portability Audit.
#
# Triggers (the "promote" gate):
#   - `pull_request: types: [ready_for_review, labeled, synchronize]` — fires
#     once a PR leaves draft (ready_for_review), is re-synced while non-draft,
#     or gets the `run-full-ci` label.
#   - `workflow_dispatch` — manual on demand.
#   - `schedule` — weekly Sunday 04:00 UTC for drift detection.
#
# A gate job filters out the cheap-loop case (draft PR without the label) by
# computing `should-run`. Downstream jobs `needs: gate` + `if: gate.outputs.run`.
#
# Run the same battery locally with `npm run ci:local` before promoting a PR.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Post-merge verification: the heavy gate is PR-gated for cost, so a merge
  # (incl. an --admin / draft-merged PR that skipped it) could land broken on
  # main and sit red only until the weekly cron. Running on push to main turns
  # that into immediate detection. Non-PR events run the full battery via the
  # gate job (event != pull_request → run=true).
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `opened`/`reopened` so a PR created directly as non-draft (single push,
    # no later `synchronize`) still runs the heavy gate — otherwise it can be
    # required by branch protection yet never report. The `gate` job below
    # still skips drafts unless they carry the `run-full-ci` label.
    types: [opened, reopened, ready_for_review, labeled, synchronize]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

concurrency:
  group: quality-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_FILTER_ARGS: ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    # Was 1 minute when this job only read event metadata. It now also resolves
    # the affected package list to shard the test matrix, which needs a checkout
    # and a dependency install (~26s warm).
    timeout-minutes: 6
    outputs:
      run: ${{ steps.decide.outputs.run }}
      shards: ${{ steps.shard.outputs.matrix }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          ACTION: ${{ github.event.action }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            # workflow_dispatch / schedule always run.
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On pull_request, run if the PR is not a draft OR has the label.
          if [[ "$IS_DRAFT" == "false" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_LABEL" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Draft PR without \`run-full-ci\` label — skipping heavy quality gates. Mark ready-for-review or apply the label to promote."
          fi

      # Resolve which packages turbo would actually test (already narrowed by
      # TURBO_FILTER_ARGS on PRs) and split them across the matrix below.
      # Sharding has to happen here rather than in the test job because turbo
      # ORs multiple `--filter` args — there is no way to intersect "affected"
      # with "this shard's packages" from inside the shard.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        if: steps.decide.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        if: steps.decide.outputs.run == 'true'
      - name: Compute test shards
        id: shard
        if: steps.decide.outputs.run == 'true'
        env:
          SHARD_COUNT: "4"
        run: |
          set -euo pipefail
          # pipefail matters: a turbo failure here must not yield an empty
          # matrix, which would skip every test and still report green.
          MATRIX=$(npx --no turbo run test ${{ env.TURBO_FILTER_ARGS }} --dry=json \
            | node scripts/ci/shard-test-packages.mjs "$SHARD_COUNT")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  test:
    # The suffix makes each shard distinguishable in the checks UI. Safe to
    # rename: branch protection requires only `oxlint (fast pass)` and
    # `Quality (Full) Gate`, never this job directly.
    name: Unit Tests (Turbo) ${{ matrix.shard }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report every shard's result rather than cancelling siblings on the
      # first failure — one red shard should not hide the state of the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.shards) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run tests via Turbo
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES" ]; then
            echo "::notice::No affected packages with tests — nothing to run."
            exit 0
          fi
          ARGS=""
          for p in $PACKAGES; do ARGS="$ARGS --filter=$p"; done
          # shellcheck disable=SC2086 — package names never contain spaces and
          # the args must word-split into separate --filter flags.
          npx turbo run test $ARGS

  # `scripts/` is not an npm workspace (`workspaces` is apps/*, packages/*,
  # tools/*, benchmarks), so turbo has no task for it and `turbo run test`
  # never reaches scripts/__tests__. Until now the only file under it that CI
  # ever executed was oxlint-export-lock.test.ts, pinned by name in
  # oxlint-parity.yml — gap-closure, sync-source-versions and the newer
  # repo-config locks (turbo cache inputs, this workflow's shard partitioner)
  # were all dead weight: committed, green locally, never run by the gate.
  # 190 tests in that suite, and the gate was running a fraction of them.
  scripts-tests:
    name: Script & Repo-Config Locks
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run scripts/__tests__
        run: npm run --silent test:scripts

  build:
    name: Build (Turbo)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          next-cache: "true"
      - name: Build via Turbo
        run: npx turbo run build ${{ env.TURBO_FILTER_ARGS }}

  typecheck:
    name: Typecheck (whole-graph tsgo)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Typecheck (whole-graph tsgo / TS7 native)
        # One `tsgo --build tsconfig.solution.json` over the full plugin graph
        # (+ @interlace/ui). A single whole-graph build is what makes TS7 faster
        # here; per-package tsgo pays Go startup 21× and loses to TS6.
        # typescript-eslint stays on typescript@6.0.3. See TS7_MIGRATION_PLAN.md.
        run: npm run typecheck

  portability:
    name: Portability Audit
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"
      - run: npm run audit:portability

  # Aggregate gate so a single PR check status surfaces the heavy-half result.
  quality-full-gate:
    name: Quality (Full) Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [gate, test, scripts-tests, build, typecheck, portability]
    if: always() && needs.gate.outputs.run == 'true'
    steps:
      - name: Render gate report
        env:
          R_TEST: ${{ needs.test.result }}
          R_SCRIPTS: ${{ needs['scripts-tests'].result }}
          R_BUILD: ${{ needs.build.result }}
          R_TYPECHECK: ${{ needs.typecheck.result }}
          R_PORTABILITY: ${{ needs.portability.result }}
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⏹" ;;
              skipped)   echo "⏭" ;;
              *)         echo "⚠️" ;;
            esac
          }

          all_pass=true
          for r in "$R_TEST" "$R_SCRIPTS" "$R_BUILD" "$R_TYPECHECK" "$R_PORTABILITY"; do
            [ "$r" = "success" ] || all_pass=false
          done
          if $all_pass; then
            header="✅ All heavy quality gates passed"
          else
            header="❌ One or more heavy quality gates failed"
          fi

          {
            echo "# $header"
            echo ""
            echo "| Gate | Result | Notes |"
            echo "|---|---|---|"
            echo "| Unit tests          | $(icon "$R_TEST") $R_TEST               | \`turbo run test\`, sharded (affected on PRs) |"
            echo "| Script/config locks | $(icon "$R_SCRIPTS") $R_SCRIPTS         | \`scripts/__tests__\` — outside every workspace |"
            echo "| Build               | $(icon "$R_BUILD") $R_BUILD             | \`turbo run build\` (affected on PRs) |"
            echo "| Typecheck           | $(icon "$R_TYPECHECK") $R_TYPECHECK     | \`tsgo --build\` whole-graph (TS7 native) |"
            echo "| Rule portability    | $(icon "$R_PORTABILITY") $R_PORTABILITY | oxlint/Biome/typescript-go compatibility |"
            echo ""
            echo "_Run \`npm run ci:local\` to mirror these gates locally before promoting a PR._"
            if ! $all_pass; then
              echo ""
              echo "**Investigate failures via the per-gate jobs above.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          $all_pass || { echo "::error::One or more heavy quality gates failed"; exit 1; }
          echo "All heavy quality gates passed."
