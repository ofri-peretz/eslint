name: Metrics freshness

# Every number Interlace publishes about itself has a shelf life. This asks,
# once a week, whether any of them has passed it.
#
# It exists because the check it runs already existed and nothing invoked it.
# On 2026-08-26 `check-audit-freshness` was wired into no workflow at all, and
# 8 of 11 artifacts were stale — the peer-health snapshot 101 days against a
# 14-day TTL. A metric does not stop being quoted just because nothing
# regenerated it.
#
# Monitoring, not gating: this never runs on a PR. A stale benchmark is a
# reason to re-measure, not a reason to block someone's unrelated change.

on:
  schedule:
    # Mondays 09:00 UTC — after the peer-health snapshot lands at 08:00, so a
    # refresh committed by that run is reflected here in the same hour.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-freshness
  cancel-in-progress: false

jobs:
  check:
    name: Are the published metrics still true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Check every published metric against its TTL
        id: freshness
        run: |
          set +e
          npx tsx scripts/check-audit-freshness.ts > freshness.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat freshness.txt
          {
            echo '### Metrics freshness'
            echo '```'
            cat freshness.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File an issue when something has gone stale
        if: steps.freshness.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Stale published metrics"
          # One rolling issue rather than a new one each week: a weekly cron
          # that opens a fresh issue trains people to close them unread.
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body=$(printf '%s\n\n```\n%s\n```\n' \
            "The weekly freshness check found published metrics past their TTL. Each line names the refresh command." \
            "$(cat freshness.txt)")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "chore"
          fi

  # Without this the jobs above can fail on a schedule with nobody watching:
  # a red cron produces no PR, no reviewer and no notification, so silence and
  # success look identical. Tracked as debt in .github/cron-alerting-debt.json.
  report:
    name: "\U0001F6A8 Report a scheduled failure"
    needs: [check]
    if: >-
      always() && github.event_name == 'schedule' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: "Metrics freshness check is failing"
          body: >-
            The freshness check did not complete, so stale cached metrics can now sit on the docs site without anything noticing they stopped updating.
          token: ${{ github.token }}
