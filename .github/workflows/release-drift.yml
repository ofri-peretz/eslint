# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Drift

# ═══════════════════════════════════════════════════════════════════════════════
# IS EVERY VERSION ON MAIN ACTUALLY ON NPM?
# ═══════════════════════════════════════════════════════════════════════════════
#
# A number that stops being produced looks exactly like a number that has not
# changed. On 2026-08-31 five packages sat bumped-but-unpublished on main and
# nothing said so — the only thing that noticed was the benchmark corpus scan,
# and only because it pins its rig to package.json versions, so its install
# died on a version npm did not have.
#
# Two ways a release stops without a red mark anywhere a human looks:
#   * a publish job reports `failure` AFTER npm publish succeeded, so the run
#     is red and the package is public;
#   * a run sits in status `waiting` on the `production` environment approval,
#     indefinitely, looking like nothing rather than like a problem.
#
# DAILY, and on a schedule rather than in the PR pipeline: this probes a
# third-party registry, and an unrelated PR has no business failing because
# npm is having a bad morning. Its output is an action item, not a gate.
#
# See docs/intents/2026-08-31-a-stuck-release-announces-itself.md
# ═══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 06:20 UTC daily — before the working day, and clear of the 08:45 codecov
    # cron and the 09:00/09:15 Monday jobs.
    # 06:35, not 06:20: `cache-audit` runs `20 */6 * * *`, so it occupies
    # minute :20 four times a day and the two met every morning. Two
    # workflows on one minute contend for the same 20 concurrent job slots.
    - cron: '35 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Version drift against npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      - name: Compare every package version against npm
        id: drift
        run: |
          set +e
          npx tsx scripts/check-release-drift.ts | tee drift.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
          {
            echo '## Release drift'
            echo
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File an issue when a release did not finish
        if: steps.drift.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Release drift: a version on main is not on npm"
          # One open issue at a time. A daily cron that opens a new issue every
          # morning is a mute button with extra steps.
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // ""')
          body=$(printf '%s\n\n```\n%s\n```\n' \
            "A package version on \`main\` is not the version npm serves. A release did not finish — check the most recent \`release.yml\` run for a job that went red after publishing, or a run sitting in status \`waiting\` on the \`production\` environment approval." \
            "$(cat drift.txt)")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "release"
          fi

  # Without this the jobs above can fail on a schedule with nobody watching:
  # a red cron produces no PR, no reviewer and no notification, so silence and
  # success look identical. Tracked as debt in .github/cron-alerting-debt.json.
  report:
    name: "\U0001F6A8 Report a scheduled failure"
    needs: [drift]
    if: >-
      always() && github.event_name == 'schedule' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: "Release drift check is failing"
          body: >-
            The drift check did not complete, so a divergence between the tags, the changelogs and what is published to npm would now go unreported.
          token: ${{ github.token }}
