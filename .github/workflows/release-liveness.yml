# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Liveness

# ─────────────────────────────────────────────────────────────────────────────
# Does the release pipeline still produce releases?
#
# On 2026-08-30 it did not, and every workflow involved was green.
# `changesets/action` errors when a `GITHUB_TOKEN` env var is set and differs
# from its `github-token` input; the step failed, so no Version Packages PR was
# opened, so nothing was versioned, so release.yml correctly published nothing.
# TEN changesets sat queued until someone happened to ask why a package had not
# shipped.
#
# Every other check in this repo answers "did a step fail". This one answers
# "did the pipeline produce what it exists to produce" — the question that
# nobody was asking, which is why the answer went unnoticed for ten changesets.
#
# It gates nothing and blocks no merge. It files an issue, which is the only
# thing that would have helped.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every six hours at :05. Earlier than issue-sweep (:40) so a stall it finds
    # is already in the backlog by the time the sweep reads it.
    - cron: "5 */6 * * *"
  # Was `push: {branches: [main], paths: [".changeset/**", "packages/*/package.json"]}`
  # — the same push event that also triggers changesets-pr.yml's "version" job,
  # which is the ONE thing that can make a "no Version PR" finding untrue. That
  # job installs (~60s) before it can push a branch; this workflow's own
  # checkout + install finished first every time, so the check ran BEFORE the
  # Version PR existed and reported a stall against a pipeline that was not
  # stalled.
  #
  # Measured, not theorized: issue #849 was filed at 15:14:01Z reporting
  # "no Version Packages PR is open" for a push whose Version PR (#850) opened
  # at 15:14:05Z — four seconds later, for that exact same push.
  #
  # `workflow_run` fires only once the named workflow's run has fully
  # completed, so by the time this job starts, changesets-pr.yml has already
  # had its one chance to open (or fail to open) the Version PR — the race is
  # gone by construction, not by timing it out. The trade is coarser scope: it
  # now runs after every push to main rather than only ones touching changeset
  # paths, because changesets-pr.yml's "version" job itself has no path filter.
  workflow_run:
    workflows: ["Changesets"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-liveness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Release pipeline is alive
    # `workflow_run` fires for every completed run of "Changesets", including
    # its PR-time `required` job (advisory changeset-presence check). Only the
    # push-triggered `version` job can affect whether a Version PR exists, so
    # restrict to that — anything else is `schedule` / `workflow_dispatch`.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list the Version Packages PR
      issues: write # the failure channel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `install: true`, and the reason is worth keeping.
      #
      # This said `install: false` -- "the script uses git, gh and `npm view`
      # only. Nothing is imported from the workspace." That was true when it was
      # written and stopped being true the moment the script gained
      # `@changesets/parse`, which it needs because a regex over changeset
      # frontmatter rejects valid YAML that changesets itself accepts.
      #
      # The comment stayed. The script then died on ERR_MODULE_NOT_FOUND in
      # 0.1s, `if: failure()` fired, and it filed "Release pipeline is stalled"
      # against a perfectly healthy pipeline (#791, 2026-09-01). A check that
      # cries wolf every six hours gets muted, and a muted check is worth less
      # than none -- which is the exact failure this check exists to prevent,
      # committed inside the check itself.
      #
      # An install costs ~30s, four times a day. Correctness is worth that.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      # On `workflow_run`, skip the publish-lag half.
      #
      # This trigger follows every push-triggered "Changesets" run, and a
      # Version PR merge is one of those pushes — it deletes the changesets it
      # consumed and bumps every version in the same commit. So this fires on
      # the release commit itself, at the one moment npm is legitimately behind
      # main, and every package would report `unpublished-bump`. That is not a
      # stall; it is a release in progress. It fired on all three push runs of
      # 2026-09-01 and produced #791 and #795 against a healthy pipeline.
      #
      # The changeset half does not race and stays on, which is the reason this
      # trigger exists: a changeset that lands with no Version PR is worth
      # knowing about in minutes. Publish lag is slow-moving and the six-hourly
      # run owns it.
      - name: Check release liveness
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node --experimental-strip-types scripts/check-release-liveness.ts
          ${{ github.event_name == 'workflow_run' && '--skip-publish-lag' || '' }}

      - name: 🚨 Report a stalled release pipeline
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "Release pipeline is stalled"
          body: >-
            Either changesets are queued with no Version Packages PR to consume
            them, or a package's version on main is ahead of its latest on npm.
            Both mean work that looks merged is not published. This is the check
            that did not exist when ten changesets sat queued behind a silently
            failing changesets action.
          token: ${{ github.token }}
