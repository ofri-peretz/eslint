# Base44 sandbox overlay.
#
# Layered ON TOP of the repo's own compose.dev.yml — it does not replace it:
#
#   docker compose -f compose.dev.yml -f sandboxes/base44/compose.override.yml up
#
# Everything about how this project builds and runs lives in compose.dev.yml and
# is vendor-neutral. This file exists only to translate one provider's
# environment into the generic hook the repo already exposes, so that adopting,
# swapping or dropping a sandbox is a change to this file and nothing else.
#
# Base44 serves the preview through a hostname derived from
# BASE44_PUBLIC_HOST_SUFFIX. Next blocks unknown hostnames in dev, so that host
# is passed through as DEV_ALLOWED_ORIGINS (see apps/docs/next.config.mjs).

services:
  docs:
    environment:
      - DEV_ALLOWED_ORIGINS=3000-${BASE44_PUBLIC_HOST_SUFFIX}
